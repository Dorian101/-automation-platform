__PAGE_STYLES__
<style>

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
  .name { font-family: var(--display); overflow-wrap: anywhere; flex: 1 1 14rem; }
  .size { color: var(--mute); font-family: var(--figures); font-size: 0.9rem; }
</style>
