<style>
  @import url('/fonts/fonts.css');
  :root {
    --bg: #101112;
    --panel: #161718;
    --border: #303234;
    --text: #f2f0e9;
    --muted: #a8a8a4;
    --accent: #477eff;
    --lime: #b9f45d;
    --coral: #ff795f;
    --amber: #f5c542;
    --error: #ff6b6b;
    --ok: #7bd88f;
    /* The hover fills stay bright in both themes: the text on them is dark
       either way, so they do not follow the colours above. */
    --fill-blue: #477eff;
    --fill-lime: #b9f45d;
    --fill-coral: #ff795f;
    --fill-amber: #f5c542;
    --diagram-edge: #3a3d42;
    --diagram-external: #1a1d28;
    --diagram-input: #121a2a;
    --diagram-identity: #161718;
    --diagram-identity-line: #56595b;
    --diagram-process: #16203c;
    --diagram-storage: #14251c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  h1, h2, h3, h4 {
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    font-weight: 500;
  }
  main {
    max-width: none;
    margin: 0;
    padding: 1.5rem 4vw 4rem;
  }
  h1 {
    font-size: 2rem;
    line-height: 1.15;
    letter-spacing: -0.015em;
    margin: 0 0 0.6rem;
  }
  .lede { font-size: 1.1rem; color: var(--muted); margin: 0 0 2.75rem; }
  h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 2.75rem 0 1rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  .lede + h2 { border-top: none; padding-top: 0; margin-top: 0; }
  h3 { font-size: 1rem; margin: 1.5rem 0 0.4rem; }
  .meta { color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem; }
  /* The architecture diagram is inline SVG so that it scales with the page and
     needs no file of its own — this project serves no static assets, and one
     diagram is not a reason to start. */
  figure.diagram { margin: 1.5rem 0; }
  figure.diagram svg { width: 100%; max-width: 42rem; height: auto; display: block; margin-inline: auto; }
  figure.diagram figcaption { text-align: center; }
  /* A phone cannot fit the drawing at a readable size, so it gets the same
     chain as a list. */
  .diagram-flow { display: none; }
  figcaption { color: var(--muted); font-size: 0.85rem; margin: 0.6rem 0 0; }
  p { margin: 0 0 1rem; }
  ul, ol { margin: 0 0 1rem; padding-left: 1.25rem; }
  li { margin-bottom: 0.5rem; }
  li::marker { color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.05rem 0.35rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.86em;
  }
  pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.9rem 1.1rem;
    overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.86rem;
    line-height: 1.55;
  }
  pre code { background: none; border: none; padding: 0; }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 0 0 1.25rem;
    padding: 0;
    list-style: none;
  }
  .chips li {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.28rem 0.75rem;
    font-size: 0.85rem;
  }
  .note {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 1.1rem 1.25rem;
    margin: 0 0 2rem;
  }
  .note p:last-child { margin-bottom: 0; }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 1.75rem;
    margin: 0 0 1.75rem;
  }
  .stats div { min-width: 7rem; }
  .stats b { display: block; font-size: 1.35rem; font-weight: 600; }
  .stats span { color: var(--muted); font-size: 0.85rem; }
  /* The about page: a technical portfolio. A huge headline over
     decorative orbit rings, then numbered project tiles that fill with their
     colour on hover. The mono face carries the small labels — numbers, tags,
     meta — and Manrope carries the reading text and the big type. */
  .hero { position: relative; overflow: hidden; padding: 4rem 0 4.5rem; margin-bottom: 2rem; }
  .eyebrow {
    font: 400 11px 'JetBrains Mono', monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.5rem;
  }
  .hero h1 {
    font-size: clamp(2.6rem, 6.5vw, 5.5rem);
    line-height: 0.95;
    letter-spacing: -0.045em;
    font-weight: 500;
    margin: 0 0 2.5rem;
    position: relative;
    z-index: 1;
  }
  .hero h1 em { color: var(--accent); font-style: normal; }
  .orbit {
    position: absolute;
    color: #6e7072;
    font: 10px 'JetBrains Mono', monospace;
    letter-spacing: 0.2em;
    display: grid;
    place-items: center;
    z-index: 0;
  }
  /* The ring is a dashed circle that turns forever, slowly, while the label
     under it stays still. It gives the hero a faint "alive" quality without a
     motion that draws the eye away from the headline. */
  .orbit::before {
    content: '';
    position: absolute;
    inset: -10px;
    border: 1px dashed var(--border);
    border-radius: 50%;
    animation: orbit-spin 90s linear infinite;
  }
  .orbit-one { width: 290px; height: 290px; right: -70px; top: 80px; }
  .orbit-two { width: 170px; height: 170px; right: 170px; top: 260px; }
  /* Inside the contact section the rings are a quiet corner mark, smaller and
     tucked against the right edge rather than the hero's oversized shapes. */
  .contact .orbit-one { width: 200px; height: 200px; right: 20px; top: 2rem; }
  .contact .orbit-two { width: 120px; height: 120px; right: 160px; top: 9rem; }
  @keyframes orbit-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .orbit::before { animation: none; }
    .viz-svg * { animation: none; }
  }
  /* The hero: a canvas report drawn by about_hero.js on /about, and the small
     SVG mark on /project. */
  .viz {
    position: absolute;
    right: 0;
    top: 6rem;
    width: min(26rem, 38%);
    z-index: 0;
    pointer-events: none;
  }
  .viz-svg { width: 100%; height: auto; display: block; }
  .viz--small { width: min(12rem, 30%); }
  /* The headline's longest line would otherwise run up to the chart beside it
     on every width until the chart reaches its own maximum. */
  html { scroll-behavior: smooth; }
  .lens { display: inline-flex; gap: 0.25rem; padding: 0.2rem; border: 1px solid var(--border); border-radius: 8px; }
  .lens[hidden] { display: none; }
  .lens button {
    border: 0;
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    background: none;
    color: var(--muted);
    font: 12px 'JetBrains Mono', monospace;
    cursor: pointer;
  }
  .lens button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  main[data-lens="brief"] .lens-deep { display: none; }
  main:not([data-lens="brief"]) .lens-brief { display: none; }
  .trace-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 1rem; }
  .trace-actions[hidden] { display: none; }
  .trace-actions button {
    padding: 0.45rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: none;
    color: var(--text);
    font: 12px 'JetBrains Mono', monospace;
    cursor: pointer;
  }
  .trace-actions button:hover { border-color: var(--accent); }
  .trace-actions button:disabled { opacity: 0.5; cursor: default; }
  .trace-result { text-align: center; min-height: 1.5rem; font: 12px 'JetBrains Mono', monospace; margin: 0.5rem 0 0; }
  .trace-title { flex-basis: 100%; margin: 0; text-align: center; color: var(--muted); font-size: 0.85rem; }
  .diagram-flow li.lit { color: var(--text); border-left: 2px solid var(--lime); }
  .diagram-flow li.stop { color: var(--text); border-left: 2px solid var(--coral); }
  section[id] { scroll-margin-top: 1.5rem; }
  .hero--report { min-height: 33rem; }
  .hero--report h1 { font-size: clamp(2.2rem, 5.6vw, 5.5rem); }
  .viz canvas { width: 100%; display: block; }
  .viz-replay {
    margin-top: 0.75rem;
    padding: 0;
    border: 0;
    background: none;
    color: var(--muted);
    font: 11px 'JetBrains Mono', monospace;
    cursor: pointer;
    pointer-events: auto;
  }
  .viz-replay:hover { color: var(--text); }
  .section-tag {
    font: 400 11px 'JetBrains Mono', monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 1rem;
  }
  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem 2.5rem;
    margin: 2rem 0 0;
  }
  .fact b {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    font-weight: 500;
    line-height: 1;
    color: var(--accent);
  }
  .fact span { color: var(--muted); font-size: 0.8rem; }
  .links { display: flex; flex-wrap: wrap; gap: 1rem 2rem; margin-top: 1.5rem; }
  .links a, .links button { font: 400 12px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; }
  .links button { padding: 0; border: 0; background: none; color: var(--accent); cursor: pointer; }
  .links button:hover { text-decoration: underline; }
  .page-action {
    margin-left: 0.5rem;
    padding: 0;
    border: 0;
    background: none;
    color: var(--muted);
    font: 11px 'JetBrains Mono', monospace;
    cursor: pointer;
  }
  .page-action:hover { color: var(--text); }
  #share-page { margin-left: 0; }
  .print-only { display: none; }
  .project-list { border-top: 1px solid var(--border); margin: 0 0 2rem; }
  .project-list--brief .project { min-height: 120px; }
  .project-list--brief .project h3 { font-size: clamp(1.4rem, 2.2vw, 2rem); }
  .case {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    padding: 2.5rem 1rem;
    border-top: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    transition: color 0.25s;
  }
  /* The same rising fill as the project rows. The figures are accent-coloured,
     which would vanish on a blue fill, so they turn dark with the text. */
  .case::before {
    content: '';
    position: absolute;
    inset: 100% 0 0;
    z-index: 0;
    transition: inset 0.35s ease;
  }
  .case:hover::before { inset: 0; }
  .case:hover { color: #111; }
  .case.blue::before { background: var(--fill-blue); }
  .case.lime::before { background: var(--fill-lime); }
  .case.coral::before { background: var(--fill-coral); }
  .case > * { position: relative; z-index: 1; }
  .case:hover .project-meta, .case:hover dt, .case:hover .fact span { color: #272727; }
  .case:hover .fact b { color: #111; }
  .case .project-meta { margin: 0 0 1rem; }
  .case h3 {
    font-size: clamp(1.7rem, 2.8vw, 2.6rem);
    letter-spacing: -0.04em;
    line-height: 1.1;
    font-weight: 500;
    margin: 0;
  }
  .case dl { margin: 0; }
  .case dt {
    font: 11px 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-top: 1.25rem;
  }
  .case dt:first-child { margin-top: 0; }
  .case dd { margin: 0.35rem 0 0; line-height: 1.6; }
  .project {
    display: grid;
    grid-template-columns: 18% 1fr 34%;
    gap: 30px;
    align-items: center;
    min-height: 220px;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    padding: 0 1rem;
    transition: color 0.25s, padding 0.25s;
  }
  .project::before {
    content: '';
    position: absolute;
    inset: 100% 0 0;
    z-index: 0;
    transition: inset 0.35s ease;
  }
  .project:hover::before { inset: 0; }
  .project:hover { color: #111; }
  .project.blue::before { background: var(--fill-blue); }
  .project.lime::before { background: var(--fill-lime); }
  .project.coral::before { background: var(--fill-coral); }
  .project.amber::before { background: var(--fill-amber); }
  .project > * { position: relative; z-index: 1; }
  .project-meta {
    font: 11px/1.7 'JetBrains Mono', monospace;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-transform: uppercase;
  }
  .project:hover .project-meta { color: #272727; }
  .project h3 { font-size: clamp(2rem, 3.4vw, 3.4rem); letter-spacing: -0.04em; line-height: 1.05; font-weight: 500; margin: 0; }
  .project p { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 0; }
  .project:hover p { color: #272727; }
  .project:hover code { background: none; border-color: currentColor; }
  .location {
    font: 12px 'JetBrains Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0;
  }
  .services {
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-top: 1.5rem;
  }
  .services span {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    font: 12px 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .services span:nth-child(even) { padding-left: 20px; border-left: 1px solid var(--border); }
  .short { max-width: 40rem; }
  .work-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 3rem;
  }
  .work-heading h2, .contact h2, .about h2 {
    font-size: clamp(2rem, 4.5vw, 4rem);
    line-height: 1.02;
    letter-spacing: -0.04em;
    font-weight: 500;
    margin: 0;
    color: var(--text);
    text-transform: none;
    border-top: none;
    padding-top: 0;
  }
  .about, .work, .experience, .contact {
    padding: 4rem 0;
    border-top: 1px solid var(--border);
  }
  .about .location { margin: 0 0 1.75rem; }
  .about > p { max-width: 46rem; margin: 0 0 1.75rem; }
  .about .note { margin-top: 2rem; }
  .experience h3 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  .experience .location { margin: 0 0 1.75rem; }
  .experience > p { margin: 0 0 1rem; }
  /* The "Техническая часть работы" line follows the place and role, and needs
     its own breathing room so it does not read as part of the heading. */
  .experience .location + p { margin-top: 2.5rem; }
  .contact { position: relative; }
  .contact h2 { margin: 0 0 1.5rem; }
  .contact ul { list-style: none; padding-left: 0; }
  .contact li { margin-bottom: 0.5rem; }
  footer {
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
  /* The report's text needs about 340px, which 38% of the page only gives on a
     wide screen. Below that it goes under the headline, as on a phone. */
  @media (max-width: 980px) {
    .hero--report { min-height: 0; }
    .hero--report .viz {
      position: static;
      width: 100%;
      max-width: 26rem;
      margin-top: 2rem;
    }
  }
  @media (max-width: 640px) {
    h1 { font-size: 1.6rem; }
    main { padding-top: 2rem; }
    .stats { gap: 1.25rem; }
    .grid { grid-template-columns: 1fr; gap: 2rem; }
    /* The hero chart is absolutely positioned beside the headline on wide
       screens; a phone has no width for that, so it drops into the flow
       below the headline instead of overlapping it. */
    .hero { padding: 2.5rem 0 3rem; }
    .hero--report h1 { font-size: 2.6rem; }
    .viz {
      position: static;
      width: 100%;
      max-width: 22rem;
      margin-top: 2rem;
    }
    .viz--small { max-width: 10rem; }
    /* The decorative rings leave the headline alone on a narrow screen. */
    .orbit { display: none; }
    .contact { padding-top: 3rem; }
    /* A card's four columns collapse to one: number and tag on top, then the
       title, then the text. The 34% right column has nothing to do on a phone. */
    .project {
      grid-template-columns: 1fr;
      gap: 0.5rem;
      align-items: start;
      min-height: 0;
      padding: 1.5rem 0;
    }
    .project-meta { flex-direction: row; gap: 0.5rem 1rem; flex-wrap: wrap; }
    .project h3 { font-size: 1.6rem; }
    .case { grid-template-columns: 1fr; gap: 1.5rem; padding: 2rem 1rem; }
    .project p { font-size: 0.9rem; }
    .work-heading { flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
    .services { grid-template-columns: 1fr; }
    .services span:nth-child(even) { padding-left: 0; border-left: none; }
    figure.diagram svg { display: none; }
    .diagram-flow {
      display: block;
      list-style: none;
      margin: 0;
      padding: 0;
      border-left: 1px solid var(--border);
    }
    .diagram-flow li { padding: 0.5rem 0 0.5rem 1rem; color: var(--muted); font-size: 0.9rem; }
    .diagram-flow b { display: block; color: var(--text); font-weight: 600; }
  }
  /* The printed page is the résumé: black on white in either theme, and without
     whatever only works on a screen. */
  @media print {
    @page { margin: 15mm; }
    html:root[data-theme], :root {
      --bg: #fff;
      --panel: #fff;
      --border: #bbb;
      --text: #000;
      --muted: #444;
      --accent: #000;
      --lime: #000;
      --diagram-edge: #888;
      --diagram-external: #fff;
      --diagram-input: #fff;
      --diagram-identity: #fff;
      --diagram-identity-line: #888;
      --diagram-process: #fff;
      --diagram-storage: #fff;
    }
    body { font-size: 10pt; line-height: 1.4; }
    main { padding: 0; }
    .menu, .attic, .theme-toggle, .viz, .orbit, .links, .note, .page-action,
    .trace-actions, .trace-result, footer, .lens { display: none; }
    .hero--report ~ .contact, .hero--report ~ .work .work-heading h2 { display: none; }
    .print-only { display: block; margin: 0.5rem 0 0; }
    .hero, .hero--report { min-height: 0; padding: 0; margin-bottom: 0.5rem; }
    .hero h1, .hero--report h1 { font-size: 20pt; line-height: 1.1; margin: 0; }
    .hero h1 br { display: none; }
    .about, .work, .experience { padding: 0.6rem 0; }
    .section-tag, .work-heading, .about .location, .experience .location { margin-bottom: 0.4rem; }
    .about > p { max-width: none; margin-bottom: 0.5rem; }
    .services { margin-top: 0.5rem; }
    .services span { padding: 4px 0; font-size: 9pt; }
    .case { grid-template-columns: 1fr; gap: 0.25rem; padding: 0.5rem 0; overflow: visible; }
    .case h3, .project h3, .experience h3 { font-size: 12pt; }
    .case dt { margin-top: 0.4rem; font-size: 8pt; }
    .case dd { margin-top: 0; line-height: 1.4; }
    .case::before, .project::before { display: none; }
    /* The tail of the case list is a project row on screen, and on paper it
       reads as one more case. */
    .project-list { margin: 0; border-top: 0; }
    .project, .project-list--brief .project {
      grid-template-columns: 1fr;
      gap: 0.25rem;
      align-items: start;
      min-height: 0;
      padding: 0.5rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 0;
      overflow: visible;
    }
    .project-list--brief .project h3 { font-size: 12pt; line-height: 1.1; }
    .project-meta { flex-direction: row; gap: 1rem; }
    .project p { color: var(--text); font-size: inherit; line-height: 1.4; }
    .case .project-meta, .project .project-meta { margin: 0 0 1rem; }
    .facts { margin-top: 0.4rem; gap: 0.25rem 1.5rem; }
    .fact b { font-size: 12pt; }
    .fact span { font-size: 8pt; }
    li { margin-bottom: 0.15rem; }
    dt, h2, h3 { break-after: avoid; }
  }
</style>
