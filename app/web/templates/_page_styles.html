<style>
  @import url('/fonts/almanac.css');
  :root {
    --paper: #11161c;
    --paper-2: #171e25;
    --ink: #e8ecf0;
    --ink-2: #c9d0d8;
    --mute: #9aa3ad;
    --rule: #2c343d;
    --rule-2: #c9d0d8;
    --acc: #5cc4c0;
    --acc-ink: #11161c;
    --low: #ff8f80;
    --track: #26303a;
    --display: 'Onest', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --reading: 'Literata', Georgia, 'Times New Roman', serif;
    --figures: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root, html:root[data-theme] {
    --bg: var(--paper);
    --panel: var(--paper-2);
    --border: var(--rule);
    --text: var(--ink);
    --muted: var(--mute);
    --accent: var(--acc);
    --lime: var(--acc);
    --coral: var(--low);
    --amber: #e3b65a;
    --error: var(--low);
    --ok: #7bd88f;
    --diagram-edge: #4a545e;
    --diagram-external: #18202a;
    --diagram-input: #142128;
    --diagram-identity: #171e25;
    --diagram-identity-line: #5c6670;
    --diagram-process: #132a2c;
    --diagram-storage: #172219;
  }
  html:root[data-theme="light"] {
    --paper: #eef0f3;
    --paper-2: #e3e7ec;
    --ink: #0f161e;
    --ink-2: #232b34;
    --mute: #4a525c;
    --rule: #c3c9d1;
    --rule-2: #2f363e;
    --acc: #0b6e72;
    --acc-ink: #f7f8fa;
    --low: #a3261b;
    --track: #d5dae0;
    --panel: #f7f8fa;
    --amber: #8f6700;
    --ok: #1f7a4c;
    --diagram-edge: #9aa3ad;
    --diagram-external: #f7f8fa;
    --diagram-input: #e4f0f0;
    --diagram-identity: #eef0f3;
    --diagram-identity-line: #9aa3ad;
    --diagram-process: #d7ebea;
    --diagram-storage: #e3ecdf;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.6 var(--reading);
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.25rem max(16px, 4vw) 3rem;
  }
  h1, h2, h3, h4 {
    font-family: var(--display);
    font-weight: 600;
    color: var(--ink);
    text-wrap: balance;
  }
  h1 {
    font-size: clamp(2.9rem, 7vw, 5.25rem);
    line-height: 0.95;
    letter-spacing: -0.035em;
    margin: 0;
    overflow-wrap: break-word;
  }
  h2 {
    font-size: clamp(2rem, 4vw, 2.5rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--rule-2);
  }
  h3 { font-size: 1.4rem; line-height: 1.2; letter-spacing: -0.01em; margin: 0; }
  p { margin: 0 0 1rem; }
  ul, ol { margin: 0 0 1rem; padding-left: 1.1em; }
  li { margin-bottom: 0.25rem; }
  li::marker { color: var(--mute); }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--acc); text-underline-offset: 0.2em; }
  a:hover { text-decoration-thickness: 2px; }
  code {
    font-family: var(--figures);
    font-size: 0.86em;
    color: var(--ink);
  }
  pre {
    background: var(--paper-2);
    border-top: 2px solid var(--rule-2);
    padding: 0.9rem 1.1rem;
    overflow-x: auto;
    font-family: var(--figures);
    font-size: 0.86rem;
    line-height: 1.55;
  }
  a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--acc);
    outline-offset: 2px;
  }
  .num { font-variant-numeric: tabular-nums; }
  .lede { color: var(--ink-2); max-width: 36em; margin: 0.9rem 0 0; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  .print-only { display: none; }

  .button {
    display: inline-block;
    padding: 0.8rem 1.35rem;
    border: 1px solid var(--acc);
    border-radius: 2px;
    background: var(--acc);
    color: var(--acc-ink);
    font: 500 15px/1.1 var(--display);
    text-decoration: none;
    cursor: pointer;
  }
  .button:hover { text-decoration: none; filter: brightness(1.08); }
  .button.outline { background: transparent; color: var(--ink); border-color: var(--ink); }
  .button:active { transform: translateY(1px); }
  .button[hidden] { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.6rem 0.75rem; margin-top: 1.75rem; }
  .small-button, .trace-actions button, .feedback-open, .feedback-buttons button {
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--rule-2);
    border-radius: 2px;
    background: transparent;
    color: var(--ink);
    font: 500 14px/1.2 var(--display);
    text-decoration: none;
    cursor: pointer;
  }
  .small-button:hover, .trace-actions button:hover, .feedback-open:hover, .feedback-buttons button:hover { text-decoration: none; background: var(--paper-2); }
  .small-button[hidden] { display: none; }
  .small-button:disabled, .trace-actions button:disabled, .feedback-buttons button:disabled { opacity: 0.6; cursor: default; }
  .small-button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .small-button .check {
    width: 1em;
    height: 1em;
    margin-right: 0.25em;
    vertical-align: -0.15em;
    fill: none;
    stroke: var(--ok);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 16;
    animation: check-draw 0.3s ease-out both;
  }
  @keyframes check-draw {
    from { stroke-dashoffset: 16; }
    to { stroke-dashoffset: 0; }
  }

  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: 2.5rem 4rem;
    align-items: start;
    padding: 3rem 0 4.5rem;
  }
  .hero > * { min-width: 0; }
  .hero--single { grid-template-columns: minmax(0, 1fr); padding-bottom: 2.5rem; }
  .role {
    margin: 1.1rem 0 0;
    font: 500 clamp(1.2rem, 2.1vw, 1.45rem)/1.3 var(--display);
    letter-spacing: -0.01em;
    color: var(--ink-2);
    text-wrap: balance;
  }
  .stack { margin: 0.9rem 0 0; color: var(--ink-2); max-width: 34em; }

  .report { margin: 0; border-top: 2px solid var(--ink); }
  .report-head { margin: 0.9rem 0 0; }
  .report-head b { display: block; font: 600 1.25rem/1.3 var(--display); letter-spacing: -0.01em; }
  .report-head span { color: var(--mute); font-size: 15px; }
  .report table { width: 100%; border-collapse: collapse; margin-top: 1rem; table-layout: fixed; }
  .report col.name { width: 34%; }
  .report col.total { width: 15%; }
  .report col.bar { width: 33%; }
  .report col.share { width: 18%; }
  .report th, .report td { text-align: left; font-weight: 400; }
  .report thead th {
    font: 500 13px/1.3 var(--reading);
    color: var(--mute);
    padding: 0 0 0.5rem;
    border-bottom: 2px solid var(--rule-2);
    vertical-align: bottom;
  }
  .report tbody th, .report tbody td, .report tfoot th, .report tfoot td {
    padding: 0.7rem 0;
    border-top: 1px solid var(--rule);
    font-size: 16px;
    vertical-align: middle;
  }
  .report tbody th { padding-right: 0.6rem; overflow-wrap: break-word; }
  .report .n, .report .p { text-align: right; font-family: var(--figures); font-size: 15px; }
  .report .bar { padding-left: 1rem; }
  .report .axis { display: flex; justify-content: space-between; font: 400 12px var(--figures); color: var(--mute); }
  .report tfoot th, .report tfoot td { border-top: 2px solid var(--rule-2); font-weight: 500; }
  .report tfoot th { font: 600 16px var(--display); }
  .track { display: block; position: relative; height: 8px; background: var(--track); }
  .track i { position: absolute; inset: 0 auto 0 0; background: var(--ink-2); }
  .track b {
    position: absolute;
    top: -5px;
    bottom: -5px;
    width: 2px;
    background: var(--acc);
    left: calc((var(--goal, 90) - 80) * 5% - 1px);
    transition: left 160ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .report tr.low th, .report tr.low .p { color: var(--low); }
  .report tr.low .track i { background: var(--low); }
  .goal { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; margin-top: 1rem; }
  .goal[hidden] { display: none; }
  .goal label { font: 500 15px var(--display); }
  .goal input { accent-color: var(--acc); width: min(220px, 100%); }
  .goal output { font: 400 15px var(--figures); min-width: 3.5em; }
  .verdict { margin: 0.6rem 0 0; font-size: 15px; color: var(--ink-2); min-height: 1.6em; }
  @media (max-width: 520px) {
    .report col.name { width: 40%; }
    .report col.bar { width: 34%; }
    .report col.share { width: 26%; }
    .report col.total, .report .n { display: none; }
  }

  section { padding: 0.5rem 0 3.5rem; }
  section[id] { scroll-margin-top: 1.5rem; }
  .case {
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: 1.1rem 4rem;
    padding: 1.75rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .case > * { min-width: 0; }
  .case h3 { font-size: 1.5rem; }
  .case .wip { font: 400 14px var(--figures); color: var(--mute); margin: 0.4rem 0 0; }
  .facts { display: flex; flex-wrap: wrap; gap: 0.5rem 1.75rem; margin-top: 1rem; }
  .fact b { display: block; font: 400 1.75rem/1.1 var(--figures); letter-spacing: -0.04em; }
  .fact span { font-size: 14px; color: var(--mute); }
  .case dl { margin: 0; }
  .case dt { font: 500 14px var(--reading); color: var(--mute); }
  .case dd { margin: 0.15rem 0 0.9rem; }
  .split {
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: 1.1rem 4rem;
    padding-top: 1.75rem;
  }
  .split > * { min-width: 0; }
  .when { color: var(--mute); margin: 0.3rem 0 0; }
  .plain { font-size: 1.15rem; max-width: 40em; margin: 0 0 3rem; }

  .lens {
    display: inline-flex;
    margin-top: 1.4rem;
    border: 1px solid var(--rule-2);
    border-radius: 2px;
  }
  .lens[hidden] { display: none; }
  .lens button {
    border: 0;
    background: none;
    color: var(--mute);
    padding: 0.45rem 0.9rem;
    font: 500 14px var(--display);
    cursor: pointer;
  }
  .lens button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  main[data-lens="brief"] .lens-deep { display: none; }
  main:not([data-lens="brief"]) .lens-brief { display: none; }
  table.counts { width: 100%; border-collapse: collapse; }
  .counts caption { text-align: left; font: 600 1.25rem var(--display); padding: 0.9rem 0 0.75rem; }
  .counts { border-top: 2px solid var(--ink); }
  .counts th, .counts td { padding: 0.55rem 0; border-top: 1px solid var(--rule); font-size: 16px; }
  .counts th { text-align: left; font-weight: 400; }
  .counts td { text-align: right; font: 400 16px var(--figures); }
  .groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 2.5rem; }
  .groups > div { min-width: 0; }
  .groups h3 { margin: 1.5rem 0 0; padding-bottom: 0.5rem; border-bottom: 2px solid var(--rule-2); font-size: 1.35rem; }
  .feature { padding: 0.9rem 0; border-bottom: 1px solid var(--rule); }
  .feature h4 { margin: 0; font-size: 1.05rem; }
  .feature p { margin: 0.25rem 0 0; font-size: 16px; color: var(--ink-2); }
  .feature .meta { font: 400 13px var(--figures); color: var(--mute); margin-top: 0.4rem; }
  table.process { width: 100%; border-collapse: collapse; margin-top: 1.25rem; }
  .process th { text-align: left; vertical-align: top; font: 600 17px/1.4 var(--display); padding: 1rem 2rem 1rem 0; width: 26%; border-top: 1px solid var(--rule); }
  .process td { vertical-align: top; padding: 1rem 0; border-top: 1px solid var(--rule); }
  .process tr:first-child th, .process tr:first-child td { border-top: 2px solid var(--rule-2); }
  .hard h3 { margin: 1.5rem 0 0; font-size: 1.25rem; }
  .hard p { margin: 0.3rem 0 0; max-width: 46em; }
  .readable { max-width: 46em; }

  figure.diagram { margin: 1.5rem 0 0; }
  figure.diagram svg { width: 100%; max-width: 46rem; height: auto; display: block; }
  figure.diagram figcaption { color: var(--mute); font-size: 15px; margin: 0.6rem 0 0; }
  .diagram-flow { display: none; }
  .trace-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; }
  .trace-actions[hidden] { display: none; }
  .trace-title { flex-basis: 100%; margin: 0; font: 600 15px var(--display); }
  .trace-result { min-height: 1.5rem; font: 400 14px var(--figures); color: var(--ink-2); margin: 0.6rem 0 0; }
  .diagram-flow li.lit { color: var(--ink); border-left: 2px solid var(--acc); }
  .diagram-flow li.stop { color: var(--ink); border-left: 2px solid var(--low); }

  table.try { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  .try th, .try td { padding: 1rem 1rem 1rem 0; border-top: 1px solid var(--rule); vertical-align: top; text-align: left; }
  .try thead th { font: 500 13px var(--reading); color: var(--mute); padding-top: 0; border-top: 0; border-bottom: 2px solid var(--rule-2); }
  .try tbody th { font: 600 1.15rem var(--display); width: 24%; }
  .try td { color: var(--ink-2); }
  .try td.go { text-align: right; white-space: nowrap; width: 1%; padding-right: 0; }
  .try a.open { font: 500 15px var(--display); }

  .site-footer { border-top: 2px solid var(--rule-2); padding-top: 1.75rem; margin-top: 1rem; }
  .site-footer .split { padding-top: 0; }
  .site-footer h2 { border: 0; padding: 0; font-size: 2rem; }
  .place { color: var(--mute); margin: 0.3rem 0 0; }
  .contact-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem 1rem;
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .contact-row:first-child { border-top: 1px solid var(--rule); }
  .contact-row .label { display: block; font: 500 14px var(--reading); color: var(--mute); }
  .contact-row .value { font: 500 clamp(1.15rem, 2.4vw, 1.5rem) var(--display); overflow-wrap: anywhere; text-decoration: none; }
  .contact-row .value:hover { text-decoration: underline; text-decoration-color: var(--acc); }
  .contact-row .do { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .footer-actions { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; padding-top: 1rem; }
  .text-button {
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    text-decoration: underline;
    text-decoration-color: var(--acc);
    text-underline-offset: 0.2em;
    cursor: pointer;
  }
  .text-button[hidden] { display: none; }
  .footer-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem 1.5rem;
    margin-top: 2.25rem;
    padding-top: 1.1rem;
    border-top: 1px solid var(--rule);
    color: var(--mute);
    font-size: 15px;
  }
  footer:not(.site-footer) {
    margin-top: 2.5rem;
    padding-top: 1.1rem;
    border-top: 2px solid var(--rule-2);
    color: var(--mute);
    font-size: 15px;
  }
  .feedback-open[hidden] { display: none; }
  dialog.feedback {
    width: min(32rem, 100% - 2rem);
    padding: 1.5rem;
    border: 0;
    border-top: 2px solid var(--ink);
    border-radius: 0;
    background: var(--paper);
    color: var(--ink);
  }
  dialog.feedback::backdrop { background: rgb(0 0 0 / 0.55); }
  dialog.feedback h3 { margin: 0 0 0.5rem; font-size: 1.25rem; }
  dialog.feedback p { margin: 0 0 1rem; color: var(--mute); font-size: 15px; }
  dialog.feedback textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--mute);
    border-radius: 2px;
    background: var(--paper-2);
    color: var(--ink);
    font: inherit;
    resize: vertical;
  }
  dialog.feedback [name="trap"] { position: absolute; left: -9999px; }
  dialog.feedback .feedback-status { min-height: 1.4em; margin: 0.5rem 0; }
  .feedback-buttons { display: flex; justify-content: flex-end; gap: 0.75rem; }
  .feedback-buttons .primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }

  @media (max-width: 900px) {
    .hero { grid-template-columns: minmax(0, 1fr); padding: 1.5rem 0 3rem; }
    .case, .split { grid-template-columns: minmax(0, 1fr); }
    .groups { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 640px) {
    figure.diagram svg { display: none; }
    .diagram-flow {
      display: block;
      list-style: none;
      margin: 0;
      padding: 0;
      border-left: 1px solid var(--rule);
    }
    .diagram-flow li { padding: 0.5rem 0 0.5rem 1rem; color: var(--mute); font-size: 15px; }
    .diagram-flow b { display: block; color: var(--ink); font-weight: 600; }
    .process tr { display: grid; border-top: 1px solid var(--rule); padding: 0.9rem 0; }
    .process tr:first-child { border-top: 2px solid var(--rule-2); }
    .process th, .process td { width: auto; border: 0; padding: 0; }
    .process td { margin-top: 0.3rem; }
    .try thead { display: none; }
    .try tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-top: 1px solid var(--rule); padding: 0.9rem 0; }
    .try th, .try td { border: 0; padding: 0; width: auto; }
    .try td:not(.go) { grid-column: 1 / -1; order: 3; margin-top: 0.3rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track b { transition: none; }
    .small-button .check { animation: none; }
  }

  @media print {
    @page { margin: 15mm; }
    html:root[data-theme], :root {
      --paper: #fff;
      --paper-2: #fff;
      --ink: #000;
      --ink-2: #111;
      --mute: #444;
      --rule: #bbb;
      --rule-2: #000;
      --acc: #000;
      --low: #000;
      --track: #ddd;
    }
    body { font-size: 10pt; line-height: 1.4; }
    main { padding: 0; max-width: none; }
    .menu, .attic, .theme-toggle, .lang-switch, .report, .actions, .plain, .small-button,
    .trace-actions, .trace-result, .site-footer, footer, .lens, .goal { display: none; }
    .print-only { display: block; margin: 0.5rem 0 0; }
    .hero { display: block; padding: 0 0 0.5rem; }
    h1 { font-size: 20pt; line-height: 1.1; }
    h2 { font-size: 13pt; padding-bottom: 0.2rem; border-bottom-width: 1px; }
    section { padding: 0.4rem 0; }
    .case, .split { grid-template-columns: 1fr; gap: 0.25rem; padding: 0.5rem 0; }
    .case h3, .split h3 { font-size: 12pt; }
    .case dt { font-size: 8pt; }
    .case dd { margin: 0 0 0.3rem; }
    .facts { margin-top: 0.3rem; gap: 0.25rem 1.5rem; }
    .fact b { font-size: 12pt; }
    .fact span { font-size: 8pt; }
    li { margin-bottom: 0.1rem; }
    dt, h2, h3 { break-after: avoid; }
  }
</style>
