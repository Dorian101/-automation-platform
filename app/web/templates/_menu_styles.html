<style>
  /* The menu's own appearance, kept apart from the pages' stylesheets.

  It is injected next to the navigation markup, because the pages do not share
  a stylesheet: the console has its own, the documents another. Putting the
  menu in either of them is what left it unstyled on one of the two.

  Written without the literal placeholder names the templates substitute:
  a comment mentioning one survives into the page and reads as a substitution
  that failed. */

  /* A soft change between pages. Lives here because every page with the menu
     loads this, and both sides of a navigation have to ask for it. */
  @view-transition { navigation: auto; }
  .menu > summary { view-transition-name: site-menu; }

  .menu { position: relative; margin-bottom: 2.5rem; }

  .menu > summary {
    display: inline-block;
    cursor: pointer;
    list-style: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.85rem;
    font-size: 0.88rem;
    color: var(--muted);
    user-select: none;
  }

  /* Chrome keeps its own triangle whatever `list-style` says. */
  .menu > summary::-webkit-details-marker { display: none; }
  .menu > summary:hover { border-color: var(--accent); color: var(--text); }
  .menu[open] > summary { color: var(--text); border-color: var(--accent); }

  .menuitems {
    position: absolute;
    top: calc(100% + 0.4rem);
    left: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 0.4rem;
    min-width: 13rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }

  .menuitems a {
    padding: 0.4rem 0.6rem;
    border-radius: 5px;
    color: var(--muted);
    font-size: 0.9rem;
    text-decoration: none;
    white-space: nowrap;
  }

  .menuitems a:hover { background: var(--bg); color: var(--text); }

  /* The attic: the menu and the account, one row above the page. Lives here
     rather than in a page's stylesheet because the page is not the thing
     that has it — every page that has a session does, and they do not share
     a stylesheet between them. */

  .attic {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .attic .menu { margin-bottom: 0; }

  .account { display: flex; align-items: center; gap: 0.75rem; }
  .who { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }

  /* The console had these because the account was on its heading. The block
     is on every page now, so the rules travel with it. */
  .secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.4rem 0.85rem;
    font-size: 0.85rem;
    border-radius: 6px;
    cursor: pointer;
  }
  .secondary:hover { border-color: var(--accent); }

  /* A narrow screen has no room for both; the block wraps under the menu
     rather than being hidden, since the way out of an account should not
     depend on the width of the window. */
  @media (max-width: 30rem) {
    .attic { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
  }
  .menuitems a[aria-current="page"] { color: var(--accent); background: var(--bg); }
</style>
