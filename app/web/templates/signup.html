<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Регистрация — Платформа автоматизации</title>
__STYLES__
</head>
<body>
<main class="card">
  <h1>Платформа автоматизации</h1>
  <p class="sub">Создание учётной записи.</p>

  __ERROR_BLOCK__

  <form method="post" action="/signup">
    <input type="hidden" name="csrf" value="__CSRF__">
    <label>
      Имя пользователя
      <input type="text" name="username" value="__USERNAME__"
             autocomplete="username" autofocus required>
    </label>
    <label>
      Пароль
      <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <button type="submit">Зарегистрироваться</button>
  </form>

  <p class="alt">Уже есть аккаунт? <a href="/login">Войти</a></p>
</body>
</html>
