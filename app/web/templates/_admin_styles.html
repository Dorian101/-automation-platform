<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2a2f3a;
    --text: #e4e7ec;
    --muted: #8b93a3;
    --accent: #4a9eff;
    --error: #ff6b6b;
    --ok: #58c98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1.25rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.75rem; }

  /* The panel's own sections. A sub-page rather than a card: these are
     tables and forms, and a card's padding is a lie about how much of the
     screen they use. */
  .tabs {
    display: flex;
    gap: 0.5rem;
    margin: 0 0 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .tabs a {
    padding: 0.5rem 0.9rem;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
  }
  .tabs a[aria-current="page"] {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .tabs a:hover { color: var(--text); }

  table { width: 100%; border-collapse: collapse; margin: 0 0 1rem; }
  th, td {
    text-align: left;
    padding: 0.55rem 0.6rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
  td.name { font-weight: 500; }
  td.when, td.mark { color: var(--muted); font-size: 0.9rem; }

  .badge {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    font-size: 0.8rem;
    border: 1px solid var(--border);
  }
  .badge.on { color: var(--ok); border-color: rgba(88, 201, 138, 0.4); }
  .badge.off { color: var(--error); border-color: rgba(255, 107, 107, 0.4); }

  form.search { display: flex; gap: 0.5rem; margin: 0 0 1.25rem; }
  form.search input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.55rem 0.7rem;
    font: inherit;
  }
  form.search input:focus { outline: none; border-color: var(--accent); }

  button {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.35rem 0.8rem;
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: var(--error); color: var(--error); }

  /* The checkbox sits in the search row rather than below it: it is part of
     the same query, and a second form would need its own submit. */
  .hideadmin {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .hideadmin input { accent-color: var(--accent); }

  .none { color: var(--muted); }
  .count { color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem; }
  .count b { color: var(--text); font-weight: 600; }
  .pager {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .pagerlink { color: var(--accent); text-decoration: none; }
  .pagerlink:hover { text-decoration: underline; }
  .legend { color: var(--muted); font-size: 0.9rem; margin: -0.5rem 0 1rem; }
  .legend code { font-size: 0.85rem; }

  /* The status dashboard. A grid of cards, each a labelled figure rather than
     a headline — the reader comes here to check a number, not to be sold one. */
  .status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
    gap: 0.9rem;
    margin: 0 0 1.75rem;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.1rem;
  }
  .stat-card h3 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 0.75rem;
  }
  .stat-list { margin: 0; }
  .stat-list div {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.32rem 0;
    border-bottom: 1px solid var(--border);
  }
  .stat-list div:last-child { border-bottom: none; }
  .stat-list dt { color: var(--muted); font-size: 0.9rem; }
  .stat-list dd {
    margin: 0;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    text-align: right;
    white-space: nowrap;
  }
  /* A timestamp and a backup file name are longer than a byte count. They
     wrap instead of overflowing the card, while the numbers stay on one line.
     A flex item will not shrink past its longest word unless min-width lets
     it, so the long name is given room to break. */
  [data-stat="last_visit"],
  [data-stat="backups.newest"] {
    white-space: normal;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .count-list { list-style: none; margin: 0; padding: 0; }
  .count-list li {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.32rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .count-list li:last-child { border-bottom: none; }
  .count-list li b { font-variant-numeric: tabular-nums; font-weight: 600; }
</style>
