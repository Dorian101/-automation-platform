<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Платформа автоматизации</title>
<meta name="description" content="Личный кабинет платформы автоматизации: заметки, напоминания и буфер обмена, теми же командами, что и в Telegram-боте.">
<meta name="robots" content="noindex, follow">
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2a2f3a;
    --text: #e4e7ec;
    --muted: #8b93a3;
    --accent: #4a9eff;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .panel h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 0.75rem;
  }
  form { display: flex; gap: 0.5rem; }
  input[type=text] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.55rem 0.7rem;
    font: inherit;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    padding: 0.55rem 1.1rem;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #output {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9rem;
  }
  #output.error { color: var(--error); }
  #rendered:empty { display: none; }
  #rendered { margin-top: 0.9rem; }
  #rendered table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  #rendered th {
    text-align: left;
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    padding: 0.4rem 0.6rem 0.4rem 0;
    border-bottom: 1px solid var(--border);
  }
  #rendered td {
    padding: 0.45rem 0.6rem 0.45rem 0;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  #rendered tbody tr:last-child td { border-bottom: none; }
  #rendered tbody tr:hover { background: var(--bg); }
  .plugin { margin-bottom: 0.9rem; }
  .plugin:last-child { margin-bottom: 0; }
  .plugin-name { font-weight: 600; }
  .plugin-desc { color: var(--muted); font-size: 0.85rem; }
  ul { margin: 0.35rem 0 0; padding-left: 1.1rem; }
  li { margin-bottom: 0.2rem; }
  .chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 0.05rem 0.4rem;
    font: inherit;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85em;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 0.75rem; }
  .topbar { margin-bottom: 1.5rem; }
  .topbar .sub { margin-bottom: 0; }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
  }
  .links a { color: var(--muted); text-decoration: none; }
  .links a:hover { color: var(--text); text-decoration: none; }
</style>
__MENU_STYLES__
</head>
<body>
<main>
  <header class="topbar">
    <h1>Платформа автоматизации</h1>
    <p class="sub">Веб-интерфейс &mdash; те же команды, что принимает Telegram-бот.</p>
  </header>

  __NAV__

  __ERROR_BLOCK__

  <div class="panel">
    <h2>Telegram</h2>
    __TELEGRAM_BLOCK__
  </div>

  <div class="panel">
    <h2>Команда</h2>
    <form id="form">
      <input type="text" id="input" placeholder="/add buy milk" autocomplete="off" autofocus>
      <button type="submit" id="send">Выполнить</button>
    </form>
    <p class="hint">Заметки хранятся раздельно по каналам и читаются вместе при связанной паре.</p>
  </div>

  <div class="panel">
    <h2>Результат</h2>
    <div id="output">Готово.</div>
    <div id="rendered"></div>
  </div>

  <div class="panel">
    <h2>Доступные команды</h2>
    <div id="commands">Загрузка&hellip;</div>
  </div>
</main>

<script nonce="__CSP_NONCE__">
const form = document.getElementById('form');
const input = document.getElementById('input');
const output = document.getElementById('output');
const rendered = document.getElementById('rendered');
const send = document.getElementById('send');

// Draws the structured payload when the plugin sent one, and nothing when it
// did not. A plugin that returns no data leaves the box with just its text,
// exactly as before this existed — nothing here is required for a result to
// be readable.
function render(payload) {
  rendered.textContent = '';

  if (!payload) return;

  if (payload.kind === 'rows') {
    renderRows(payload);
    return;
  }

  // An unknown kind is not an error. The core does not know the vocabulary,
  // so a plugin is free to send something this page has not grown a painter
  // for yet; the text above is still the answer, and this stays silent rather
  // than showing an empty frame where the reader expects content.
}

function renderRows(payload) {
  const columns = Array.isArray(payload.columns) ? payload.columns : [];
  const rows = Array.isArray(payload.rows) ? payload.rows : [];

  if (!columns.length || !rows.length) return;

  const table = document.createElement('table');

  // Every value goes in through textContent, never innerHTML: a note is
  // whatever someone typed, and it must not be able to become markup.
  const head = document.createElement('thead');
  const headRow = document.createElement('tr');

  for (const column of columns) {
    const cell = document.createElement('th');
    cell.textContent = column.label != null ? column.label : column.key;
    headRow.appendChild(cell);
  }

  head.appendChild(headRow);
  table.appendChild(head);

  const body = document.createElement('tbody');

  for (const row of rows) {
    const tableRow = document.createElement('tr');

    for (const column of columns) {
      const cell = document.createElement('td');
      const value = row[column.key];
      cell.textContent = value == null ? '' : String(value);
      tableRow.appendChild(cell);
    }

    body.appendChild(tableRow);
  }

  table.appendChild(body);
  rendered.appendChild(table);
}

function parseInput(raw) {
  const trimmed = raw.trim();
  const space = trimmed.indexOf(' ');
  if (space === -1) return { command: trimmed, args: '' };
  return { command: trimmed.slice(0, space), args: trimmed.slice(space + 1) };
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const { command, args } = parseInput(input.value);
  if (!command) return;

  send.disabled = true;
  output.classList.remove('error');
  output.textContent = 'Выполняю…';
  rendered.textContent = '';

  try {
    const response = await fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command, args }),
    });
    const data = await response.json();

    if (!response.ok) {
      output.classList.add('error');
      output.textContent = data.error || 'Запрос не выполнен';
    } else {
      output.textContent = data.result;
      render(data.data);
      input.value = '';
    }
  } catch (err) {
    output.classList.add('error');
    output.textContent = 'Нет связи с сервером';
  } finally {
    send.disabled = false;
    input.focus();
  }
});

fetch('/api/commands')
  .then((response) => response.json())
  .then((data) => {
    const container = document.getElementById('commands');
    container.innerHTML = '';

    for (const plugin of data.plugins) {
      const block = document.createElement('div');
      block.className = 'plugin';

      const name = document.createElement('div');
      name.className = 'plugin-name';
      name.textContent = plugin.name;
      block.appendChild(name);

      const desc = document.createElement('div');
      desc.className = 'plugin-desc';
      desc.textContent = plugin.description;
      block.appendChild(desc);

      const list = document.createElement('ul');
      for (const [command, description] of Object.entries(plugin.commands)) {
        const item = document.createElement('li');
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = command;
        // A trailing space is what makes "add" turn into "/add " so the reader
        // can go straight to typing the text, while a bare "/notes" runs as-is.
        chip.addEventListener('click', () => {
          input.value = command + ' ';
          input.focus();
        });
        item.appendChild(chip);
        item.appendChild(document.createTextNode(' — ' + description));
        list.appendChild(item);
      }
      block.appendChild(list);

      container.appendChild(block);
    }
  })
  .catch(() => {
    document.getElementById('commands').textContent = 'Не удалось загрузить список команд.';
  });
</script>
</body>
</html>
