<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &mdash; Automation Platform</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2a2f3a;
    --text: #e4e7ec;
    --muted: #8b93a3;
    --accent: #4a9eff;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem;
  }
  h1 { font-size: 1.2rem; margin: 0 0 0.2rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.25rem; }
  .error {
    color: var(--error);
    font-size: 0.9rem;
    margin: 0 0 1rem;
    padding: 0.55rem 0.7rem;
    background: rgba(255, 107, 107, 0.08);
    border: 1px solid rgba(255, 107, 107, 0.35);
    border-radius: 6px;
  }
  form { display: flex; flex-direction: column; gap: 0.85rem; }
  label {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.55rem 0.7rem;
    font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 0.25rem;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    padding: 0.6rem 1.1rem;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<main class="card">
  <h1>Automation Platform</h1>
  <p class="sub">Sign in to continue.</p>

  __ERROR_BLOCK__

  <form method="post" action="/login">
    <label>
      Username
      <input type="text" name="username" value="__USERNAME__"
             autocomplete="username" autofocus required>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
