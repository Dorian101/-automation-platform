<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — Платформа автоматизации</title>
__STYLES__
<style>
  /* A plugin page may need more room than a document: a kanban board or a
     table wants width, where an essay wants a narrow measure. The base
     document width is lifted here, for every plugin page alike. The max
     width alone would pin the block to the left edge and leave the right
     half of a wide window empty — the auto margins centre it. */
  main { max-width: 76rem; margin: 0 auto; }
  .pagehead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .monthpick { display: flex; gap: 0.5rem; align-items: center; }
  /* The hidden attribute loses to any author `display` rule, and this element
     sets one — without this, `monthpick.hidden = true` would leave the arrows
     on screen for a page that has no month to move. */
  [hidden] { display: none !important; }
  .monthpick input, .monthpick button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font: inherit;
    font-size: 0.9rem;
  }
  /* Readonly because the arrows are the navigation; browsers grey readonly
     fields out, so the text colour is restored to match a live one. */
  .monthpick input { text-align: center; min-width: 9rem; color: var(--text); }
  .monthpick button { cursor: pointer; }
  .monthpick button:hover { border-color: var(--accent); }
  .totals {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    align-items: baseline;
    margin: 0 0 1.5rem;
  }
  .totals .big { font-size: 2.2rem; font-weight: 600; line-height: 1; }
  .totals .cap { color: var(--muted); font-size: 0.85rem; }
  .totals .delta { font-size: 0.95rem; color: var(--muted); }
  .totals .delta.up { color: var(--error); }
  .totals .delta.down { color: var(--ok); }
  .bars { margin: 0 0 1.5rem; }
  .formrow + .bars { margin-top: 2.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
  .barrow { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.45rem; }
  .barlabel {
    width: 9rem;
    flex: none;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bartrack { flex: 1; background: var(--panel); border-radius: 4px; height: 1.4rem; }
  .barfill { height: 100%; background: var(--accent); border-radius: 4px; }
  .barvalue {
    width: 6rem;
    flex: none;
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
  }
  .barshare {
    width: 3.5rem;
    flex: none;
    text-align: right;
    color: var(--muted);
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
  }
  /* align-items: flex-start, not stretch and not flex-end. Stretched, a
     button takes the height of the tallest field in its row; flex-end left a
     select riding a few pixels lower than the fields beside it, because its
     own height differs and its baseline is not the text baseline. Aligning to
     the top keeps every label on one line and the fields under it level. */
  .formrow {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  /* The submit button has no label above it, so it aligns to the input line
     while the labelled fields align by their top edge. */
  .formrow .btn { align-self: flex-end; }
  .field { display: flex; flex-direction: column; gap: 0.25rem; }
  .field label { font-size: 0.78rem; color: var(--muted); }
  .field input, .field select, .field textarea {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    font: inherit;
    font-size: 0.9rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .btn {
    background: var(--accent);
    color: #fff;
    /* Transparent rather than none, so the button's box matches the inputs'
       height once the row is aligned to their bottom edge. */
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 0.45rem 1rem;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .tools { margin: 0 0 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .tablewrap { overflow-x: auto; }
  .field.wide { flex: 1 1 100%; }
  textarea.mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.85rem;
    white-space: pre;
    tab-size: 4;
    width: 100%;
    box-sizing: border-box;
  }
  .viewer-title {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 0.5rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    font: inherit;
  }
  .btn .check {
    width: 1em;
    height: 1em;
    margin-right: 0.25em;
    vertical-align: -0.15em;
    fill: none;
    stroke: var(--ok);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 16;
    animation: check-draw 0.3s ease-out both;
  }
  @keyframes check-draw {
    from { stroke-dashoffset: 16; }
    to { stroke-dashoffset: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn .check { animation: none; }
  }
  textarea.viewer {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem;
    margin-bottom: 0.6rem;
    resize: vertical;
  }
  .textedit textarea, .textedit input { width: 100%; box-sizing: border-box; }
  .textedit textarea { resize: vertical; }
  .textedit { margin-bottom: 0.6rem; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--text); }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.data th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: 0.75rem;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 0.35rem 0.5rem 0.35rem 0; border-bottom: 1px solid var(--border);
  }
  table.data td {
    padding: 0.45rem 0.5rem 0.45rem 0;
    border-bottom: 1px solid var(--border);
  }
  table.data td.longword { overflow-wrap: anywhere; }
  table.data tbody tr:last-child td { border-bottom: none; }
  table.data .num { text-align: right; font-variant-numeric: tabular-nums; }
  .recent td:last-child, .recent th:last-child { text-align: right; width: 1%; }
  .message { margin: 0 0 1rem; font-size: 0.9rem; }
  .message.err { color: var(--error); }
  .empty { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
  .funnel { margin: 0 0 1.5rem; }
  .fnrow { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.45rem; }
  .fnlabel {
    width: 12rem;
    flex: none;
    font-size: 0.9rem;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fntrack { flex: 1; background: var(--panel); border-radius: 4px; height: 1.6rem; }
  .fnfill { height: 100%; background: var(--accent); border-radius: 4px; min-width: 2px; }
  .fnvalue {
    width: 7rem;
    flex: none;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .fnshare { color: var(--muted); font-size: 0.82rem; margin-left: 0.4rem; }
  table.data tr.flagged { background: rgba(255, 107, 107, 0.07); }
  table.data td.acts { text-align: right; }
  table.data td.acts .btn {
    padding: 0.25rem 0.6rem;
    font-size: 0.78rem;
    margin: 0.15rem 0 0.15rem 0.3rem;
    white-space: nowrap;
  }
  table.data a { color: var(--accent); font-size: 0.82rem; }
  table.data a:hover { text-decoration: underline; }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 0.5rem 0 1.5rem; }
  .demobar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 0.7rem 1rem;
    margin: 0 0 1.5rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  /* The kanban board: three columns side by side, one per status. A pile of
     tasks reads as a board, not as a long list, and moving a card between the
     columns is the whole of changing its status. */
  .kanban { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start; }
  .kbcol {
    flex: 1 1 0;
    min-width: 13rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1rem 0.5rem;
  }
  .kbcol h2 {
    margin: 0 0 0.9rem;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    /* The document stylesheet gives every h2 a top rule; a column head is a
       label, not a section break, so that rule is dropped here. */
    border-top: none;
    padding-top: 0;
  }
  /* The column head lays the label left and the "+" right, so adding a task
     reads as an action of the "to do" column rather than the whole page. */
  .kbhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin: 0 0 0.9rem;
  }
  .kbhead h2 { margin: 0; }
  .kbhead .addbtn {
    font-size: 0.9rem;
    padding: 0.2rem 0.5rem;
    line-height: 1;
  }
  .kbcard {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 0.6rem;
    margin-bottom: 0.7rem;
    cursor: pointer;
  }
  .kbcard:hover { border-color: var(--accent); }
  .board-moving::view-transition-group(*) { animation-duration: 0.35s; }
  .kbcard.overdue { border-color: var(--error); }
  .kbcard .toprow { display: flex; align-items: flex-start; gap: 0.4rem; margin-bottom: 0.25rem; }
  .kbcard .text { font-size: 0.9rem; line-height: 1.35; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .kbcard .dots { display: flex; gap: 0.18rem; flex: none; padding-top: 0.15rem; }
  .kbcard .dot {
    width: 0.55rem; height: 0.55rem; border-radius: 50%;
    border: 1px solid transparent;
  }
  .kbcard .dot.p1 { background: var(--error); }
  .kbcard .dot.p2 { background: var(--amber); }
  .kbcard .dot.p3 { background: var(--ok); }
  .kbcard .due { font-variant-numeric: tabular-nums; font-size: 0.78rem; color: var(--muted); }
  .kbcard.overdue .due { color: var(--error); }
  .kbcard .acts {
    display: flex;
    gap: 0.35rem;
    margin-top: 0.5rem;
    justify-content: flex-end;
  }
  .kbcard .acts button {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.15rem 0.5rem;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .kbcard .acts button:hover { border-color: var(--accent); color: var(--text); }
  .kbcard .acts button.del:hover { border-color: var(--error); color: var(--error); }
  .kbcard.expanded { cursor: default; }
  .kbcard .detail { display: none; margin-top: 0.6rem; }
  .kbcard.expanded .detail { display: block; }
  .kbcard .detail .fieldrow {
    display: flex; gap: 0.6rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 0.6rem;
  }
  .kbcard .detail .fieldrow .field { flex: 1 1 8rem; min-width: 7rem; }
  .kbempty { color: var(--muted); font-size: 0.82rem; padding: 0.4rem 0.2rem 0.6rem; }
  /* The sort control on the board page. Its own bar rather than reusing the
     month picker, which is a month's navigation, not a generic select. */
  .sortbar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .sortbar select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font: inherit;
    font-size: 0.9rem;
  }
  .sortbar select:focus { outline: none; border-color: var(--accent); }
  /* The "+" button that opens the creation dialog. It sits beside the sort
     control rather than as a full-height form, so a grown pile never pushes
     the act of adding a task below the fold. */
  .addbtn {
    background: var(--accent);
    color: #fff;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
  }
  .addbtn:hover { filter: brightness(1.08); }
  /* The creation dialog: an overlay with the form on a card, closed by the
     backdrop, the × button or Escape. */
  .dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.6);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 4rem 1rem 1rem;
    z-index: 50;
  }
  .dialog {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.25rem 1rem;
    width: 100%;
    max-width: 30rem;
  }
  .dialog .dhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .dialog .dhead h2 {
    margin: 0;
    font-size: 1rem;
    text-transform: none;
    letter-spacing: normal;
    color: var(--text);
    border-top: none;
    padding-top: 0;
  }
  .dialog .dclose {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 0.2rem;
    line-height: 1;
  }
  .dialog .dclose:hover { color: var(--text); }
  .dialog .formrow { align-items: flex-end; }
  .dialog .formrow .field { flex: 1 1 100%; }
  @media (max-width: 40rem) {
    .field input, .field select, .field textarea, .monthpick input,
    .monthpick button, .sortbar select, .viewer-title, textarea.mono { font-size: 16px; }
    .formrow .field { flex: 1 1 9rem; min-width: 0; }
    .formrow .field.wide { flex-basis: 100%; }
    .field input, .field select { width: 100%; box-sizing: border-box; }
    .monthpick { margin-bottom: 1rem; }
    .monthpick input { flex: 1; min-width: 0; }
    .monthpick button, .btn, table.data td.acts .btn { min-height: 2.5rem; }
    .totals { gap: 1rem 1.5rem; }
    .totals .big { font-size: 1.8rem; }
    .barrow, .fnrow { flex-wrap: wrap; row-gap: 0.2rem; }
    .barlabel, .fnlabel { width: 100%; text-align: left; }
    .fnvalue { width: auto; }
    table.data thead { display: none; }
    table.data tr {
      display: flex; flex-wrap: wrap; gap: 0.2rem 1rem;
      padding: 0.6rem 0; border-bottom: 1px solid var(--border);
    }
    table.data tbody tr:last-child { border-bottom: none; }
    table.data td { display: flex; gap: 0.35rem; padding: 0; border: none; }
    table.data td::before { content: attr(data-label); color: var(--muted); }
    table.data td:first-child { flex-basis: 100%; font-weight: 500; }
    table.data td:first-child::before, table.data td.acts::before { content: none; }
    table.data td:empty { display: none; }
    table.data td.acts { flex-basis: 100%; gap: 0.5rem; padding-top: 0.3rem; }
    table.data td.acts .btn { margin: 0; }
    .kbcard .acts button, .addbtn { min-width: 2.5rem; min-height: 2.5rem; }
  }
</style>
__MENU_STYLES__
</head>
<body>
<main>
  __NAV__

  <p class="demobar" id="demobar" hidden>Это демонстрация. Данные вымышленные,
    всё, что вы введёте, удаляется ежедневно.</p>

  <div class="pagehead">
    <h1>__TITLE__</h1>
    <div class="monthpick" id="monthpick" hidden>
      <button type="button" id="prev-month" class="ghost" aria-label="Предыдущий месяц">‹</button>
      <input type="text" id="month" readonly aria-label="Месяц">
      <button type="button" id="next-month" class="ghost" aria-label="Следующий месяц">›</button>
    </div>
  </div>

  <p class="message err" id="message" role="alert" hidden></p>
  <p class="sr-only" id="announce" aria-live="polite"></p>

  <div id="root"></div>
</main>

<script type="application/json" id="initial-view">__INITIAL_VIEW__</script>
<script nonce="__CSP_NONCE__">
(function () {
  const PAGE_PATH = '__PAGE_PATH__';
  const ACTION_URL = '__ACTION_URL__';
  const IS_DEMO = __IS_DEMO__;
__PAGE_SCRIPT__
})();
</script>
</body>
</html>
