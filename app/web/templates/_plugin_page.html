<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — Платформа автоматизации</title>
__STYLES__
<style>
  /* A plugin page may need more room than a document: a kanban board or a
     table wants width, where an essay wants a narrow measure. The base
     document width is lifted here, for every plugin page alike. The max
     width alone would pin the block to the left edge and leave the right
     half of a wide window empty — the auto margins centre it. */
  main { max-width: 76rem; margin: 0 auto; }
  .pagehead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .monthpick { display: flex; gap: 0.5rem; align-items: center; }
  /* The hidden attribute loses to any author `display` rule, and this element
     sets one — without this, `monthpick.hidden = true` would leave the arrows
     on screen for a page that has no month to move. */
  [hidden] { display: none !important; }
  .monthpick input, .monthpick button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font: inherit;
    font-size: 0.9rem;
  }
  /* Readonly because the arrows are the navigation; browsers grey readonly
     fields out, so the text colour is restored to match a live one. */
  .monthpick input { text-align: center; min-width: 9rem; color: var(--text); }
  .monthpick button { cursor: pointer; }
  .monthpick button:hover { border-color: var(--accent); }
  .totals {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    align-items: baseline;
    margin: 0 0 1.5rem;
  }
  .totals .big { font-size: 2.2rem; font-weight: 600; line-height: 1; }
  .totals .cap { color: var(--muted); font-size: 0.85rem; }
  .totals .delta { font-size: 0.95rem; color: var(--muted); }
  .totals .delta.up { color: var(--error); }
  .totals .delta.down { color: var(--ok); }
  .bars { margin: 0 0 1.5rem; }
  .barrow { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.45rem; }
  .barlabel {
    width: 9rem;
    flex: none;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bartrack { flex: 1; background: var(--panel); border-radius: 4px; height: 1.4rem; }
  .barfill { height: 100%; background: var(--accent); border-radius: 4px; }
  .barvalue {
    width: 6rem;
    flex: none;
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
  }
  .barshare {
    width: 3.5rem;
    flex: none;
    text-align: right;
    color: var(--muted);
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
  }
  /* align-items: flex-start, not stretch and not flex-end. Stretched, a
     button takes the height of the tallest field in its row; flex-end left a
     select riding a few pixels lower than the fields beside it, because its
     own height differs and its baseline is not the text baseline. Aligning to
     the top keeps every label on one line and the fields under it level. */
  .formrow {
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  /* The submit button has no label above it, so it aligns to the input line
     while the labelled fields align by their top edge. */
  .formrow .btn { align-self: flex-end; }
  .field { display: flex; flex-direction: column; gap: 0.25rem; }
  .field label { font-size: 0.78rem; color: var(--muted); }
  .field input, .field select, .field textarea {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    font: inherit;
    font-size: 0.9rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .btn {
    background: var(--accent);
    color: #fff;
    /* Transparent rather than none, so the button's box matches the inputs'
       height once the row is aligned to their bottom edge. */
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 0.45rem 1rem;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .tools { margin: 0 0 1.5rem; }
  .tablewrap { overflow-x: auto; }
  .field.wide { flex: 1 1 100%; }
  textarea.mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.85rem;
    white-space: pre;
    tab-size: 4;
    width: 100%;
    box-sizing: border-box;
  }
  .viewer-title {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 0.5rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    font: inherit;
  }
  .btn .check {
    width: 1em;
    height: 1em;
    margin-right: 0.25em;
    vertical-align: -0.15em;
    fill: none;
    stroke: var(--ok);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 16;
    animation: check-draw 0.3s ease-out both;
  }
  @keyframes check-draw {
    from { stroke-dashoffset: 16; }
    to { stroke-dashoffset: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn .check { animation: none; }
  }
  textarea.viewer {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem;
    margin-bottom: 0.6rem;
    resize: vertical;
  }
  .textedit textarea, .textedit input { width: 100%; box-sizing: border-box; }
  .textedit textarea { resize: vertical; }
  .textedit { margin-bottom: 0.6rem; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--text); }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.data th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: 0.75rem;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 0.35rem 0.5rem 0.35rem 0; border-bottom: 1px solid var(--border);
  }
  table.data td {
    padding: 0.45rem 0.5rem 0.45rem 0;
    border-bottom: 1px solid var(--border);
  }
  table.data tbody tr:last-child td { border-bottom: none; }
  table.data .num { text-align: right; font-variant-numeric: tabular-nums; }
  .recent td:last-child, .recent th:last-child { text-align: right; width: 1%; }
  .message { margin: 0 0 1rem; font-size: 0.9rem; }
  .message.err { color: var(--error); }
  .empty { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
  .funnel { margin: 0 0 1.5rem; }
  .fnrow { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.45rem; }
  .fnlabel {
    width: 12rem;
    flex: none;
    font-size: 0.9rem;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fntrack { flex: 1; background: var(--panel); border-radius: 4px; height: 1.6rem; }
  .fnfill { height: 100%; background: var(--accent); border-radius: 4px; min-width: 2px; }
  .fnvalue {
    width: 7rem;
    flex: none;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .fnshare { color: var(--muted); font-size: 0.82rem; margin-left: 0.4rem; }
  table.data tr.flagged { background: rgba(255, 107, 107, 0.07); }
  table.data td.acts { text-align: right; white-space: nowrap; }
  table.data td.acts .btn {
    padding: 0.25rem 0.6rem;
    font-size: 0.78rem;
    margin-left: 0.3rem;
  }
  table.data a { color: var(--accent); font-size: 0.82rem; }
  table.data a:hover { text-decoration: underline; }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 0.5rem 0 1.5rem; }
  .demobar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 0.7rem 1rem;
    margin: 0 0 1.5rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  /* The kanban board: three columns side by side, one per status. A pile of
     tasks reads as a board, not as a long list, and moving a card between the
     columns is the whole of changing its status. */
  .kanban { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start; }
  .kbcol {
    flex: 1 1 0;
    min-width: 13rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1rem 0.5rem;
  }
  .kbcol h2 {
    margin: 0 0 0.9rem;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    /* The document stylesheet gives every h2 a top rule; a column head is a
       label, not a section break, so that rule is dropped here. */
    border-top: none;
    padding-top: 0;
  }
  /* The column head lays the label left and the "+" right, so adding a task
     reads as an action of the "to do" column rather than the whole page. */
  .kbhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin: 0 0 0.9rem;
  }
  .kbhead h2 { margin: 0; }
  .kbhead .addbtn {
    font-size: 0.9rem;
    padding: 0.2rem 0.5rem;
    line-height: 1;
  }
  .kbcard {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 0.6rem;
    margin-bottom: 0.7rem;
    cursor: pointer;
  }
  .kbcard:hover { border-color: var(--accent); }
  .board-moving::view-transition-group(*) { animation-duration: 0.35s; }
  .kbcard.overdue { border-color: var(--error); }
  .kbcard .toprow { display: flex; align-items: flex-start; gap: 0.4rem; margin-bottom: 0.25rem; }
  .kbcard .text { font-size: 0.9rem; line-height: 1.35; flex: 1; }
  .kbcard .dots { display: flex; gap: 0.18rem; flex: none; padding-top: 0.15rem; }
  .kbcard .dot {
    width: 0.55rem; height: 0.55rem; border-radius: 50%;
    border: 1px solid transparent;
  }
  .kbcard .dot.p1 { background: var(--error); }
  .kbcard .dot.p2 { background: var(--amber); }
  .kbcard .dot.p3 { background: var(--ok); }
  .kbcard .due { font-variant-numeric: tabular-nums; font-size: 0.78rem; color: var(--muted); }
  .kbcard.overdue .due { color: var(--error); }
  .kbcard .acts {
    display: flex;
    gap: 0.35rem;
    margin-top: 0.5rem;
    justify-content: flex-end;
  }
  .kbcard .acts button {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.15rem 0.5rem;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .kbcard .acts button:hover { border-color: var(--accent); color: var(--text); }
  .kbcard .acts button.del:hover { border-color: var(--error); color: var(--error); }
  .kbcard.expanded { cursor: default; }
  .kbcard .detail { display: none; margin-top: 0.6rem; }
  .kbcard.expanded .detail { display: block; }
  .kbcard .detail .fieldrow {
    display: flex; gap: 0.6rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 0.6rem;
  }
  .kbcard .detail .fieldrow .field { flex: 1 1 8rem; min-width: 7rem; }
  .kbempty { color: var(--muted); font-size: 0.82rem; padding: 0.4rem 0.2rem 0.6rem; }
  /* The sort control on the board page. Its own bar rather than reusing the
     month picker, which is a month's navigation, not a generic select. */
  .sortbar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .sortbar select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font: inherit;
    font-size: 0.9rem;
  }
  .sortbar select:focus { outline: none; border-color: var(--accent); }
  /* The "+" button that opens the creation dialog. It sits beside the sort
     control rather than as a full-height form, so a grown pile never pushes
     the act of adding a task below the fold. */
  .addbtn {
    background: var(--accent);
    color: #fff;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
  }
  .addbtn:hover { filter: brightness(1.08); }
  /* The creation dialog: an overlay with the form on a card, closed by the
     backdrop, the × button or Escape. */
  .dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.6);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 4rem 1rem 1rem;
    z-index: 50;
  }
  .dialog {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.25rem 1rem;
    width: 100%;
    max-width: 30rem;
  }
  .dialog .dhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .dialog .dhead h2 {
    margin: 0;
    font-size: 1rem;
    text-transform: none;
    letter-spacing: normal;
    color: var(--text);
    border-top: none;
    padding-top: 0;
  }
  .dialog .dclose {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 0.2rem;
    line-height: 1;
  }
  .dialog .dclose:hover { color: var(--text); }
  .dialog .formrow { align-items: flex-end; }
  .dialog .formrow .field { flex: 1 1 100%; }
  @media (max-width: 40rem) {
    .field input, .field select, .field textarea, .monthpick input,
    .monthpick button, .sortbar select, .viewer-title, textarea.mono { font-size: 16px; }
    .formrow .field { flex: 1 1 9rem; min-width: 0; }
    .formrow .field.wide { flex-basis: 100%; }
    .field input, .field select { width: 100%; box-sizing: border-box; }
    .monthpick { margin-bottom: 1rem; }
    .monthpick input { flex: 1; min-width: 0; }
    .monthpick button, .btn, table.data td.acts .btn { min-height: 2.5rem; }
    .totals { gap: 1rem 1.5rem; }
    .totals .big { font-size: 1.8rem; }
    .barrow, .fnrow { flex-wrap: wrap; row-gap: 0.2rem; }
    .barlabel, .fnlabel { width: 100%; text-align: left; }
    .fnvalue { width: auto; }
    table.data thead { display: none; }
    table.data tr {
      display: flex; flex-wrap: wrap; gap: 0.2rem 1rem;
      padding: 0.6rem 0; border-bottom: 1px solid var(--border);
    }
    table.data tbody tr:last-child { border-bottom: none; }
    table.data td { display: flex; gap: 0.35rem; padding: 0; border: none; }
    table.data td::before { content: attr(data-label); color: var(--muted); }
    table.data td:first-child { flex-basis: 100%; font-weight: 500; }
    table.data td:first-child::before, table.data td.acts::before { content: none; }
    table.data td:empty { display: none; }
    table.data td.acts { flex-basis: 100%; gap: 0.5rem; padding-top: 0.3rem; }
    table.data td.acts .btn { margin: 0; }
    .kbcard .acts button, .addbtn { min-width: 2.5rem; min-height: 2.5rem; }
  }
</style>
__MENU_STYLES__
</head>
<body>
<main>
  __NAV__

  <p class="demobar" id="demobar" hidden>Это демонстрация. Данные вымышленные,
    всё, что вы введёте, удаляется ежедневно.</p>

  <div class="pagehead">
    <h1>__TITLE__</h1>
    <div class="monthpick" id="monthpick" hidden>
      <button type="button" id="prev-month" class="ghost" aria-label="Предыдущий месяц">‹</button>
      <input type="text" id="month" readonly aria-label="Месяц">
      <button type="button" id="next-month" class="ghost" aria-label="Следующий месяц">›</button>
    </div>
  </div>

  <p class="message err" id="message" role="alert" hidden></p>
  <p class="sr-only" id="announce" aria-live="polite"></p>

  <div id="root"></div>
</main>

<script type="application/json" id="initial-view">__INITIAL_VIEW__</script>
<script nonce="__CSP_NONCE__">
(function () {
  const PAGE_PATH = '__PAGE_PATH__';
  const ACTION_URL = '__ACTION_URL__';
  const IS_DEMO = __IS_DEMO__;
  const root = document.getElementById('root');
  const message = document.getElementById('message');
  const monthLabel = document.getElementById('month');
  const monthpick = document.getElementById('monthpick');

  let view = JSON.parse(document.getElementById('initial-view').textContent);

  // Field values a person set by hand, keyed by field id. Empty until
  // something is changed, which is why opening the page behaves exactly as
  // it did before this existed.
  let stickyValues = {};

  // -- drawing ------------------------------------------------------------
  // -- drawing ------------------------------------------------------------
  // Everything below builds DOM nodes and assigns textContent. A category
  // name, a company, a note — whatever a person typed — must never be able to
  // become markup.

  // Every section is drawn only if the description carries it, and every word
  // on screen comes from the description too. The page has no idea what it is
  // looking at: the applications plugin has no month and no chart, and the
  // spending plugin has no funnel. Hardcoding either one here is what left the
  // applications page blank — the first thing it did was read view.month.label,
  // which that page does not have, and the whole render stopped.
  const SECTIONS = [
    ['totals', drawTotals],
    ['funnel', drawFunnel],
    ['chart', drawChart],
    ['table', drawTable],
    ['list', drawList],
    ['kanban', drawKanban],
    ['forms', drawForms],
    ['tools', drawTools],
    ['panel', drawPanel],
  ];

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = String(text);
    return node;
  }

  function draw() {
    root.textContent = '';
    message.hidden = true;

    // Said on the page rather than left to the reader to wonder: the numbers
    // are invented, and a demonstration that does not say so reads as a leak
    // of somebody's real spending.
    document.getElementById('demobar').hidden = !IS_DEMO;

    // The month control is part of the page, not of a section, but it is
    // still only shown when the description has a month to show.
    const hasMonth = view.month != null;
    monthpick.hidden = !hasMonth;

    if (hasMonth) {
      monthLabel.value = view.month.label;
    }

    // A plugin may name its own order; the default suits the rest.
    const order = view.layout
      ? view.layout.map((key) => SECTIONS.find(([name]) => name === key)).filter(Boolean)
      : SECTIONS;

    for (const [key, painter] of order) {
      if (view[key] != null) painter(view[key]);
    }

    const focused = (view.forms || []).find((f) => f.focus && !f.dialog);
    if (focused) {
      const first = document.getElementById(focused.id + '-' + focused.fields[0].name);
      if (first) {
        first.scrollIntoView({ block: 'center' });
        first.focus();
      }
    }
  }

  function drawTotals(totals) {
    // A list of figures with their captions, in the order given. Spending
    // sends a month and a comparison; applications sends counts. Neither
    // shape is assumed here.
    const items = totals.items || [];

    if (!items.length) return;

    const box = el('div', 'totals');

    for (const item of items) {
      const cell = el('div');
      cell.appendChild(el('div', 'big', item.value));
      cell.appendChild(el('div', 'cap', item.caption));
      box.appendChild(cell);
    }

    if (totals.delta) {
      // Up or down is sent as a direction, not inferred from the sign of a
      // string: "+12%" and "−12%" are both readings, and which one is the
      // good news is a question about spending that this page cannot answer.
      box.appendChild(
        el('div', 'delta ' + (totals.delta.direction || ''), totals.delta.text),
      );
    }

    root.appendChild(box);
  }

  function drawFunnel(funnel) {
    const items = funnel.items || [];

    if (!items.length) {
      root.appendChild(el('p', 'empty', funnel.empty || 'Нет данных'));
      return;
    }

    const box = el('div', 'funnel');

    for (const item of items) {
      const row = el('div', 'fnrow');
      row.appendChild(el('div', 'fnlabel', item.label));

      const track = el('div', 'fntrack');
      const fill = el('div', 'fnfill');
      // A number the backend computed, so the width is a number and not a
      // figure parsed back out of a formatted string.
      fill.style.width = (item.share || 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      const value = el('div', 'fnvalue', item.count);
      value.appendChild(el('span', 'fnshare', item.share_text));
      row.appendChild(value);

      box.appendChild(row);
    }

    root.appendChild(box);

    if (funnel.rejected && funnel.rejected.count) {
      // Beside the funnel rather than in it: a rejection is an exit, and a
      // bar there would mean the widths no longer lined up.
      root.appendChild(
        el(
          'p',
          'hint',
          funnel.rejected.label + ': ' + funnel.rejected.count,
        ),
      );
    }
  }

  function drawChart(chart) {
    const items = chart.items || [];

    if (!items.length) {
      root.appendChild(el('p', 'empty', chart.empty || 'Нет данных'));
      return;
    }

    const box = el('div', 'bars');

    for (const item of items) {
      const row = el('div', 'barrow');
      row.appendChild(el('div', 'barlabel', item.label));

      const track = el('div', 'bartrack');
      const fill = el('div', 'barfill');
      fill.style.width = item.share + '%';
      fill.title = item.label + ': ' + item.value;
      track.appendChild(fill);
      row.appendChild(track);

      row.appendChild(el('div', 'barvalue', item.value));
      // Its own element rather than a gap in the previous string: the two
      // figures answer different questions, and run together as
      // "320  38%" they read as one number nobody can tell apart.
      row.appendChild(el('div', 'barshare', item.share_text));

      box.appendChild(row);
    }

    root.appendChild(box);
  }

  // A table, drawn from its own description: which columns, which rows, and
  // what may be done to each row. Alignment comes from the column rather than
  // from its name, so a table of categories and a table of companies are the
  // same renderer.
  function drawTable(table, title) {
    const rows = table.rows || [];

    if (!rows.length) {
      if (table.empty) root.appendChild(el('p', 'empty', table.empty));
      return;
    }

    if (title) root.appendChild(el('h2', null, title));

    for (const tool of table.tools || []) {
      const button = el('button', 'btn ghost', tool.label);
      button.addEventListener('click', () => send(tool.action, tool.params || {}, button));
      root.appendChild(button);
    }

    const t = el('table', 'data');
    const thead = el('thead');
    const hrow = el('tr');

    for (const col of table.columns) {
      hrow.appendChild(el('th', col.num ? 'num' : '', col.label));
    }

    if (table.actions) hrow.appendChild(el('th', ''));
    thead.appendChild(hrow);
    t.appendChild(thead);

    const tbody = el('tbody');

    for (const row of rows) {
      const tr = el('tr');

      if (row.silent) {
        // Set by the plugin, which is the only place that knows a row has
        // been waiting too long.
        tr.className = 'flagged';
      }

      for (const col of table.columns) {
        const cell = cellFor(col, row);
        cell.dataset.label = col.label;
        tr.appendChild(cell);
      }

      if (table.actions) {
        const cell = el('td', 'acts');
        for (const action of row[table.actions] || []) {
          const button = el(
            'button',
            'btn ' + (action.kind || ''),
            action.label,
          );
          button.addEventListener('click', () => {
            if (action.copy) copyFromServer(action, button);
            else send(action.action, action.params || {}, button);
          });
          cell.appendChild(button);
        }
        tr.appendChild(cell);
      }

      tbody.appendChild(tr);
    }

    t.appendChild(tbody);
    const scroller = el('div', 'tablewrap');
    scroller.appendChild(t);
    root.appendChild(scroller);
  }

  // A cell is either text or a link, decided by the column rather than by
  // what the value happens to look like.
  //
  // The href goes in through setAttribute and is re-checked here: the plugin
  // refuses anything that is not http(s) on the way in, and this is the second
  // time it is worth refusing, since an href the browser will follow is not
  // the same thing as a string in a column. `noopener` is what keeps the page
  // that opens from reaching back through window.opener.
  function cellFor(col, row) {
    const value = row[col.key];

    if (col.link && value) {
      if (!/^https?:\/\//i.test(value)) {
        return el('td', '', '');
      }

      const td = el('td');
      const anchor = document.createElement('a');
      anchor.href = value;
      anchor.textContent = 'Открыть';
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';
      td.appendChild(anchor);
      return td;
    }

    return el('td', col.num ? 'num' : '', value);
  }

  function drawPanel(panel) {
    root.appendChild(el('h2', null, 'Сниппет'));
    const title = document.createElement('input');
    title.type = 'text';
    title.className = 'viewer-title';
    title.value = panel.title;
    const area = document.createElement('textarea');
    area.className = 'mono viewer';
    area.rows = 18;
    area.spellcheck = false;
    area.value = panel.text;
    root.appendChild(title);
    root.appendChild(area);
    const bar = el('div', 'tools');
    if (panel.save) {
      const save = el('button', 'btn', 'Сохранить изменения');
      save.addEventListener('click', () => {
        send(panel.save.action, {
          ...(panel.save.params || {}), title: title.value, body: area.value,
        }, save);
      });
      bar.appendChild(save);
    }
    const copy = el('button', 'btn ghost', 'Скопировать');
    copy.addEventListener('click', () => copyNow(area.value, copy));
    const close = el('button', 'btn ghost', 'Закрыть');
    close.addEventListener('click', () => send('view', {}, close));
    bar.appendChild(copy);
    bar.appendChild(close);
    root.appendChild(bar);
  }

  const CHECK =
    '<svg class="check" viewBox="0 0 16 16" aria-hidden="true">' +
    '<path d="M3 8.5 6.5 12 13 4.5"/></svg>';

  function confirmCopy(button, succeeded) {
    const label = button.textContent;
    button.innerHTML = succeeded ? CHECK : '';
    const text = succeeded ? 'Скопировано' : 'Не удалось';
    button.append(text);
    const announce = document.getElementById('announce');
    announce.textContent = '';
    requestAnimationFrame(() => { announce.textContent = text; });
    button.disabled = true;
    setTimeout(() => {
      button.textContent = label;
      button.disabled = false;
    }, 1500);
  }

  function copyBySelection(text) {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    area.remove();
    return done;
  }

  function copyNow(text, button) {
    if (!navigator.clipboard) {
      confirmCopy(button, copyBySelection(text));
      return;
    }
    navigator.clipboard.writeText(text).then(
      () => confirmCopy(button, true),
      () => confirmCopy(button, copyBySelection(text)),
    );
  }

  async function fetchClip(action) {
    const response = await fetch(ACTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        page: PAGE_PATH,
        action: action.action,
        payload: { ...(view.keep || {}), ...(action.params || {}) },
      }),
    });
    const data = await response.json();
    if (!response.ok || typeof data.view.clip !== 'string') {
      throw new Error(data.error || 'Ошибка');
    }
    return data.view.clip;
  }

  async function copyFromServer(action, button) {
    const text = fetchClip(action);
    text.catch(() => {});
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        const blob = text.then((value) => new Blob([value], { type: 'text/plain' }));
        await navigator.clipboard.write([new ClipboardItem({ 'text/plain': blob })]);
      } else {
        await navigator.clipboard.writeText(await text);
      }
      confirmCopy(button, true);
    } catch (e) {
      try {
        confirmCopy(button, copyBySelection(await text));
      } catch (missing) {
        confirmCopy(button, false);
      }
    }
  }

  // Page-level buttons, such as a switch between a plugin's screens.
  function drawTools(tools) {
    if (!tools.length) return;
    const bar = el('div', 'tools');
    for (const tool of tools) {
      const button = el('button', 'btn ghost', tool.label);
      button.addEventListener('click', () => send(tool.action, tool.params || {}, button));
      bar.appendChild(button);
    }
    root.appendChild(bar);
  }

  function drawList(list) {
    for (const one of Array.isArray(list) ? list : [list]) drawTable(one, one.title);
  }

  // The kanban board. Three columns from the description, each with cards that
  // move between them and open to reveal every attribute for inline editing.
  function drawKanban(board) {
    // The sort control, drawn above the columns. It changes only the order
    // inside every column, not the board's structure.
    const sortRow = el('div', 'sortbar');
    sortRow.appendChild(el('label', null, 'Сортировка'));
    const sortSelect = document.createElement('select');
    for (const [value, label] of [['priority', 'По приоритету'], ['due', 'По сроку'], ['created', 'По дате создания']]) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      sortSelect.appendChild(opt);
    }
    sortSelect.value = view.order || 'priority';
    sortSelect.addEventListener('change', () => {
      send('view', { order: sortSelect.value }, null);
    });
    sortRow.appendChild(sortSelect);
    root.appendChild(sortRow);

    const wrap = el('div', 'kanban');

    for (const col of board.columns) {
      const column = el('section', 'kbcol');

      // The column head: label on the left, and the "+" to add a task on the
      // first column only — that is where undone work lands.
      const head = el('div', 'kbhead');
      head.appendChild(el('h2', null, col.label));
      if (col.status === 'todo') {
        const addBtn = el('button', 'addbtn', '+');
        addBtn.title = 'Новая задача';
        addBtn.addEventListener('click', () => openDialog());
        head.appendChild(addBtn);
      }
      column.appendChild(head);

      const cards = col.cards || [];
      if (!cards.length) {
        column.appendChild(el('p', 'kbempty', 'Пусто'));
      }

      for (const card of cards) {
        column.appendChild(cardNode(card));
      }

      wrap.appendChild(column);
    }

    root.appendChild(wrap);
  }

  // One card, collapsed and opened on click. The card carries the task's
  // identity in a data attribute so the buttons address the right row.
  function cardNode(card) {
    const node = el('div', 'kbcard' + (card.overdue ? ' overdue' : ''));
    node.dataset.id = card.id;
    node.dataset.status = card.status;
    // A name of its own is what lets a card fly from its old place to the new.
    node.style.viewTransitionName = 'task-' + card.id;

    // The top line: text on the left, priority dots on the right.
    const toprow = el('div', 'toprow');
    toprow.appendChild(el('div', 'text', card.text));

    const dots = el('div', 'dots');
    if (card.priority != null) {
      const d = el('span', 'dot p' + card.priority, '');
      d.title = card.priority_label || '';
      dots.appendChild(d);
    }
    toprow.appendChild(dots);
    node.appendChild(toprow);

    // The deadline, when there is one, as a plain date.
    if (card.due_at) {
      node.appendChild(el('div', 'due', card.due_at));
    } else {
      node.appendChild(el('div', 'due', 'Без срока'));
    }
    if (card.repeat_label) node.appendChild(el('div', 'due', '↻ ' + card.repeat_label));

    // The move and delete controls, visible on the card itself: a step back
    // and a step forward, each to the neighbouring column.
    const acts = el('div', 'acts');
    for (const target of card.moves || []) {
      const b = el('button', '', target.dir === 'back' ? '←' : '→');
      b.title = target.label;
      b.addEventListener('click', (ev) => {
        ev.stopPropagation();
        send('move', { id: card.id, status: target.status }, b);
      });
      acts.appendChild(b);
    }
    const del = el('button', 'del', '✕');
    del.title = 'Удалить';
    del.addEventListener('click', (ev) => {
      ev.stopPropagation();
      send('delete', { id: card.id }, del);
    });
    acts.appendChild(del);
    node.appendChild(acts);

    // The expanded detail, opened by clicking anywhere on the card. Every
    // attribute is editable in place here. Clicks inside it do not toggle the
    // card, or interacting with a field — a date picker especially — would
    // collapse the card mid-edit.
    const detail = el('div', 'detail');
    const text = document.createElement('input');
    text.type = 'text';
    text.value = card.text;
    const description = document.createElement('textarea');
    description.rows = 3;
    description.placeholder = 'Детали, ссылки';
    description.value = card.description || '';
    const due = document.createElement('input');
    due.type = 'date';
    due.value = card.due_iso || '';
    // One button for the typed fields; the selects save as they change.
    const save = el('button', '', 'Сохранить');
    save.addEventListener('click', (ev) => {
      ev.stopPropagation();
      // Saved means done with the card: the redraw shows it folded.
      openCards.delete(card.id);
      send('text', {
        id: card.id, text: text.value, description: description.value, due_at: due.value,
      }, save);
    });
    const typed = el('div', 'textedit');
    typed.appendChild(detailRow('Текст', text));
    typed.appendChild(detailRow('Описание', description));
    typed.appendChild(detailRow('Срок', due));
    typed.appendChild(save);
    detail.appendChild(typed);
    detail.appendChild(detailRow('Приоритет', priorityField(card)));
    detail.appendChild(detailRow('Повтор', repeatField(card)));
    detail.appendChild(
      detailRow('Создано', null, card.created_at),
    );
    detail.addEventListener('click', (ev) => ev.stopPropagation());
    node.appendChild(detail);

    // Kept open across a redraw, so saving a field does not fold the card.
    if (openCards.has(card.id)) node.classList.add('expanded');
    node.addEventListener('click', () => {
      node.classList.toggle('expanded');
      if (node.classList.contains('expanded')) openCards.add(card.id);
      else openCards.delete(card.id);
    });

    return node;
  }

  const openCards = new Set();

  function repeatField(card) {
    const select = document.createElement('select');
    for (const [value, label] of [['', 'Не повторять'], ['daily', 'Каждый день'], ['weekly', 'Каждую неделю'], ['monthly', 'Каждый месяц']]) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      select.appendChild(opt);
    }
    select.value = card.repeat || '';
    select.addEventListener('change', () => {
      send('repeat', { id: card.id, repeat: select.value }, select);
    });
    return select;
  }

  // A labelled inline field. `field` is null when the value is read-only, in
  // which case `readonlyText` is shown instead.
  function detailRow(labelText, field, readonlyText) {
    const row = el('div', 'fieldrow');
    const wrap = el('div', 'field');
    wrap.appendChild(el('label', null, labelText));

    if (field) {
      wrap.appendChild(field);
    } else {
      const span = el('span', null, readonlyText);
      span.style.fontSize = '0.85rem';
      wrap.appendChild(span);
    }

    row.appendChild(wrap);
    return row;
  }

  // The priority pick inside an expanded card. A select with a blank first
  // option for "none", so clearing a priority is a deliberate choice.
  function priorityField(card) {
    const select = document.createElement('select');
    const none = document.createElement('option');
    none.value = '';
    none.textContent = '—';
    select.appendChild(none);
    for (const [value, label] of [['1', 'Высокий'], ['2', 'Средний'], ['3', 'Низкий']]) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      select.appendChild(opt);
    }
    select.value = card.priority == null ? '' : String(card.priority);
    select.addEventListener('change', () => {
      send('priority', { id: card.id, priority: select.value }, select);
    });
    return select;
  }

  function drawForms() {
    for (const form of view.forms || []) {
      if (form.dialog) {
        // A dialog form is not part of the page flow: it is shown on request
        // through the "+" button, so it never takes a row off the board.
        continue;
      }
      const h = el('h2', null, form.title);
      root.appendChild(h);

      const row = buildFormRow(form, root);
      root.appendChild(row);
    }
  }

  // The creation dialog, opened by "+". It renders the first dialog form (the
  // board page has exactly one) over the board, so adding a task never means
  // scrolling to a form that has moved below a grown pile.
  function openDialog() {
    const form = (view.forms || []).find((f) => f.dialog);
    if (!form) return;

    const overlay = el('div', 'dialog-overlay');
    const box = el('div', 'dialog');

    const head = el('div', 'dhead');
    head.appendChild(el('h2', null, form.title));
    const close = el('button', 'dclose', '×');
    close.title = 'Закрыть';
    close.addEventListener('click', () => overlay.remove());
    head.appendChild(close);
    box.appendChild(head);

    box.appendChild(buildFormRow(form, box));
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    overlay.addEventListener('click', (ev) => {
      if (ev.target === overlay) overlay.remove();
    });
    const onKey = (ev) => {
      if (ev.key === 'Escape') {
        overlay.remove();
        document.removeEventListener('keydown', onKey);
      }
    };
    document.addEventListener('keydown', onKey);

    // Focus the first text field so typing starts straight away.
    const first = box.querySelector('input');
    if (first) first.focus();
  }

  // Remove any open dialog. Called after a submit so the board redraw does not
  // leave a stale overlay behind.
  function closeDialog() {
    const overlay = document.querySelector('.dialog-overlay');
    if (overlay) overlay.remove();
  }

  // Build one form's field row and return it, wiring the submit button to the
  // shared action endpoint. Used both by the in-flow forms and the dialog.
  function buildFormRow(form, container) {
    const row = el('div', 'formrow');
    const inputs = {};

    for (const field of form.fields) {
      if (field.type === 'hidden') {
        inputs[field.name] = { value: field.value };
        continue;
      }
      const wrap = el('div', 'field');
      const label = el('label', null, field.label);
      const tag = field.type === 'select' || field.type === 'textarea' ? field.type : 'input';
      const input = document.createElement(tag);
      if (tag === 'input') input.type = field.type || 'text';
      if (tag === 'textarea') {
        input.rows = 12;
        input.className = 'mono';
        input.spellcheck = false;
        wrap.classList.add('wide');
      }
      if (field.type !== 'select' && field.placeholder) input.placeholder = field.placeholder;
      if (field.value != null) input.value = field.value;

      if (field.type === 'select') {
        const options = field.options || [];
        if (!options.length) {
          const empty = document.createElement('option');
          empty.textContent = field.empty || 'Нет вариантов';
          input.appendChild(empty);
          input.disabled = true;
        }
        for (const opt of options) {
          const option = document.createElement('option');
          option.value = opt.value;
          option.textContent = opt.label;
          input.appendChild(option);
        }
        if (field.value != null) input.value = field.value;
      }

      const id = form.id + '-' + field.name;
      label.setAttribute('for', id);
      input.id = id;
      wrap.appendChild(label);
      wrap.appendChild(input);
      row.appendChild(wrap);
      inputs[field.name] = input;

      if (field.sticky) {
        if (stickyValues[id] != null) {
          input.value = stickyValues[id];
        }
        input.addEventListener('change', () => {
          stickyValues[id] = input.value;
        });
      }
    }

    const submit = el('button', 'btn', form.submit);
    if (form.fields.some((f) => f.required && f.type === 'select' && !(f.options || []).length)) {
      submit.disabled = true;
    }
    row.appendChild(submit);

    if (form.cancel) {
      const cancel = el('button', 'btn ghost', form.cancel.label);
      cancel.addEventListener('click', () => {
        send(form.cancel.action, form.cancel.params || {}, cancel);
      });
      row.appendChild(cancel);
    }

    const doSubmit = () => {
      if (submit.disabled) return;
      const payload = {};
      for (const [name, input] of Object.entries(inputs)) payload[name] = input.value;
      // The month on screen goes along, so the answer stays on it.
      if (view.month && payload.month == null) payload.month = view.month.value;
      closeDialog();
      send(form.id, payload, submit);
    };

    submit.addEventListener('click', doSubmit);

    // Enter in any field submits the form, the way a native form behaves.
    // The row is a <div>, not a <form>, so there is no implicit submit; this
    // restores it without the implicit-submit edge cases a <form> would drag in.
    row.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter') return;
      const t = ev.target;
      if (t && (t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return; // Enter picks a select option here
      ev.preventDefault();
      doSubmit();
    });

    return row;
  }

  // -- talking to the plugin ---------------------------------------------

  async function send(action, payload, button) {
    // What the plugin asked to have back with every action, such as which of
    // its screens is open; an action that names the value itself wins.
    payload = { ...(view.keep || {}), ...payload };
    if (button) button.disabled = true;
    showMessage('', true);
    try {
      const response = await fetch(ACTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          page: PAGE_PATH,
          action: action,
          payload: payload,
        }),
      });
      const data = await response.json();
      if (!response.ok) {
        showMessage(data.error || 'Ошибка', false);
        return;
      }
      view = data.view;
      if (payload.month) view.month.value = payload.month;
      redraw(action);
      if (view.notice) showMessage(view.notice, false);
    } catch (err) {
      showMessage('Не удалось связаться с сервером', false);
    } finally {
      if (button) button.disabled = false;
    }
  }

  // The actions that move cards around the board. Editing an opened card is
  // left out: its fields should not fade while somebody is typing in them.
  const BOARD_MOVES = new Set(['move', 'delete', 'view']);

  function redraw(action) {
    if (
      !view.kanban ||
      !BOARD_MOVES.has(action) ||
      !document.startViewTransition ||
      matchMedia('(prefers-reduced-motion: reduce)').matches
    ) {
      draw();
      return;
    }

    const page = document.documentElement;
    page.classList.add('board-moving');
    document.startViewTransition(draw).finished.finally(() => {
      page.classList.remove('board-moving');
    });
  }

  function showMessage(text, isClear) {
    message.hidden = isClear;
    message.textContent = isClear ? '' : text;
  }

  // -- month navigation ---------------------------------------------------
  //
  // The previous and next month arrive ready-made from the plugin. The page
  // does not work them out: a year boundary is easy to get wrong, and a
  // second copy of that arithmetic is a second chance to get it wrong too.
  //
  // There is no dropdown: a select carries its own up/down arrows, so the
  // control offered two different ways to change the month. The two arrows
  // are the whole navigation.
  //
  // Moving the month hands the date back to it. A date picked by hand belongs
  // to the month it was picked for, and keeping it after switching would put
  // the next expense back into the month just left behind.

  document.getElementById('prev-month').addEventListener('click', () => {
    stickyValues = {};
    send('month', { month: view.month.prev }, null);
  });
  document.getElementById('next-month').addEventListener('click', () => {
    stickyValues = {};
    send('month', { month: view.month.next }, null);
  });

  // A date field opens its calendar on any click, not only on the tiny icon
  // the browser draws. Chrome on some Windows setups only opens the picker on
  // that icon, and a field a user clicks the text of should behave the same.
  // Caught on the way down: an opened task card stops clicks on the way up.
  document.addEventListener('click', (ev) => {
    const t = ev.target;
    if (t && t.tagName === 'INPUT' && t.type === 'date') {
      try { t.showPicker(); } catch (e) { /* not a picker-bearing field */ }
    }
  }, true);

  const LIVE_EVERY_MS = 10000;
  let liveTimer = null;
  let liveBusy = false;
  let liveStopped = false;

  document.addEventListener('input', (ev) => {
    if (ev.target && ev.target.dataset) ev.target.dataset.typed = '1';
  }, true);

  function readerIsBusy() {
    if (document.querySelector('.dialog-overlay')) return true;
    if (view.panel || view.hold) return true;
    if ((view.forms || []).some((f) => f.cancel)) return true;
    const active = document.activeElement;
    if (active && root.contains(active) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(active.tagName)) {
      return true;
    }
    for (const field of root.querySelectorAll('input, textarea, select')) {
      if (field.dataset.typed && field.value !== '') return true;
    }
    return false;
  }

  function livePayload() {
    const payload = { ...(view.keep || {}) };
    if (view.month && payload.month == null) payload.month = view.month.value;
    return payload;
  }

  async function refreshLive() {
    if (!view.live || liveStopped || liveBusy || document.hidden || readerIsBusy()) return;
    liveBusy = true;
    try {
      const response = await fetch(ACTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page: PAGE_PATH, action: 'view', payload: livePayload() }),
      });
      if (response.status === 401) {
        liveStopped = true;
        stopLive();
        return;
      }
      if (!response.ok) return;
      const data = await response.json();
      if (!data.view || readerIsBusy()) return;
      if (JSON.stringify(data.view) === JSON.stringify(view)) return;
      view = data.view;
      draw();
    } catch (err) {
      return;
    } finally {
      liveBusy = false;
    }
  }

  function startLive() {
    if (!view.live || liveStopped || liveTimer) return;
    liveTimer = setInterval(refreshLive, LIVE_EVERY_MS);
  }

  function stopLive() {
    if (liveTimer) clearInterval(liveTimer);
    liveTimer = null;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopLive();
      return;
    }
    refreshLive();
    startLive();
  });

  draw();
  if (!document.hidden) startLive();
})();
</script>
</body>
</html>
