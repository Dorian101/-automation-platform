<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#14161a" />

  <radialGradient id="glow" cx="0.36" cy="0.5" r="0.6">
    <stop offset="0%" stop-color="#1b212c" />
    <stop offset="100%" stop-color="#14161a" />
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Core and its six modules. The hub is the point a plugin plugs into;
       the spokes are the only motion in the mark, and they are structure,
       not a conversation. -->
  <g stroke="#4a9eff" stroke-width="3" opacity="0.45">
    <line x1="450" y1="315" x2="590" y2="390" />
    <line x1="450" y1="315" x2="450" y2="470" />
    <line x1="450" y1="315" x2="310" y2="390" />
    <line x1="450" y1="315" x2="310" y2="240" />
    <line x1="450" y1="315" x2="450" y2="160" />
    <line x1="450" y1="315" x2="590" y2="240" />
  </g>

  <g fill="#272b35" stroke="#3a4a63" stroke-width="2">
    <rect x="564" y="362" width="52" height="52" rx="10" />
    <rect x="424" y="444" width="52" height="52" rx="10" />
    <rect x="284" y="362" width="52" height="52" rx="10" />
    <rect x="284" y="214" width="52" height="52" rx="10" />
    <rect x="424" y="134" width="52" height="52" rx="10" />
    <rect x="564" y="214" width="52" height="52" rx="10" />
  </g>

  <rect x="400" y="265" width="100" height="100" rx="18" fill="#4a9eff" />

  <text x="672" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="62" font-weight="700" fill="#e4e7ec">Платформа</text>
  <text x="672" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="62" font-weight="700" fill="#e4e7ec">автоматизации</text>
  <text x="672" y="428" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" fill="#9aa3b3">Веб-интерфейс — те же команды,</text>
  <text x="672" y="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="24" fill="#9aa3b3">что в Telegram-боте</text>
</svg>