# Weekly pull requests for the Python dependencies in uv.lock. Minor and patch
# updates arrive together as one pull request; a major version gets its own,
# because that is the one worth reading. The workflow runs the full test job
# on each, and merging one deploys like any other push to main.
#
# No `github-actions` entry: the workflow uses no third-party actions.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
