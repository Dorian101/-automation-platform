# Two jobs. `test` runs ruff and pytest on the pushed commit, and a failure
# stops there: the server keeps what it was running. `deploy` never sees the
# source, only the credentials to open one connection and run scripts/deploy.sh
# on the host.
#
# Why SSH rather than a self-hosted runner on the server: a runner living
# there would be another process on the box with repository access and
# `systemctl`, to install and keep upgrading. This keeps the host to one
# script and one key.
#
# Why that is not a new exposure: whoever can push to main can already have
# their code executed on the server, because the deploy runs it. Triggering a
# deploy removes the waiting, not the permission.
#
# Note what is *not* claimed here. The ruleset on main does not put a reviewer
# between the owner and the server: an author cannot approve their own pull
# request, so for one person there is no setting that does. It refuses force
# pushes and branch deletion for everyone, the owner included. The boundary is
# the GitHub account itself.
#
# No third-party action is used. `webfactory/ssh-agent`, `setup-uv` and their
# neighbours are the usual way to do this and each one is code from somebody
# else's account with write access to this repository's pipeline. The few lines
# below are the whole of it. Even `actions/checkout` is left out: the repository
# is public, and two git commands do what the test job needs.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two pushes in quick succession would otherwise race: the second pull
  # happens while the first service is still restarting.
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # The names and the empty password are what tests/conftest.py sets. Trust
      # is safe here: the database lives for one job and holds nothing.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automation
          POSTGRES_DB: automation_platform_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Fetch the pushed commit
        run: |
          git init --quiet .
          git fetch --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout --quiet FETCH_HEAD

      - name: Install the project
        run: |
          pipx install uv
          uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run the deploy on the host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          # The pinned host key, not ssh-keyscan. Scanning at deploy time is
          # trust on first use, which means the first machine to answer
          # decides who the host is for ever after — and a runner deciding
          # that is not a defence.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh
          # The secret holds the key base64-encoded, and this is the only
          # reason. A multi-line BEGIN/END block pasted into a secret field
          # comes back with its line endings changed or lost, and OpenSSH
          # then fails with `error in libcrypto` — a message that names
          # neither the line nor the cause, in a log where the key is the
          # thing being set up.
          #
          # One line of base64 has exactly one representation that survives
          # the trip. That is worth four lines of shell.
          printf '%s' "$DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # One connection, and no command passed: authorized_keys forces
          # scripts/deploy.sh whatever is written here. Passing one anyway
          # would look as though it did something and would not, and a
          # separate "test the connection" call would simply deploy twice —
          # the forced command ignores the argument just as much.
          # BatchMode stops a bad key from hanging the job on a password
          # prompt until the timeout.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST"

