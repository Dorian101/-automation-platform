[project]
name = "automation-platform"
version = "0.1.0"
description = "Modular automation platform with Telegram interface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.29.1",
    "aiohttp-socks>=0.11.0",
    "aiohttp[speedups]>=3.14.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "aiohttp-test-utils>=0.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
